$("#dDelete").onclick = async () => {
  const memo = state.memo;
  if (detailDirty() && !confirm("고친 내용은 저장되지 않습니다. 이 메모를 휴지통으로 옮길까요?")) return;
  $("#dDelete").disabled = true;
  try {
    await api(`/api/memos/${memo.id}`, { method: "DELETE" });
    state.selected.delete(memo.id);
    $("#detail").close();
    toast("휴지통으로 옮겼습니다", { label: "되돌리기", run: () => restoreMemo(memo.id) });
    render(); loadSidebar(); loadTags();
  } catch (e) { toast("삭제 실패: " + e.message); }
  finally { $("#dDelete").disabled = false; }
};

// ---------------------------------------------------------------- 화면 테마
// <html data-theme-choice> 는 사용자가 고른 값(없으면 Windows 설정을 따름), data-theme 은 실제로 쓰는 색이다.
const THEME_LABELS = { light: "화이트", dark: "다크" };
const themeChoice = () => document.documentElement.dataset.themeChoice || "";
const currentTheme = () => document.documentElement.dataset.theme || "dark";

function previewTheme(theme) {
  if (theme) document.documentElement.dataset.themeChoice = theme;
  else delete document.documentElement.dataset.themeChoice;
  applyTheme();
}

// 바로 바꾸고 저장한다. 저장에 실패하면 원래 테마로 되돌린다.
async function saveTheme(theme) {
  const before = themeChoice();
  previewTheme(theme);
  try {
    await api("/api/settings", { method: "PUT", body: { values: { "ui.theme": theme } } });
    return true;
  } catch (e) {
    previewTheme(before);
    toast("테마를 저장하지 못했습니다: " + e.message);
    return false;
  }
}

function themeOptionsHTML() {
  return `<div class="theme-options" role="radiogroup" aria-label="화면 테마">${Object.entries(THEME_LABELS).map(([theme, label]) => `
    <button type="button" class="theme-option" role="radio" aria-checked="false" data-theme-option="${theme}">
      <span class="theme-preview ${theme}" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="theme-name">${label}</span><span class="meta">${theme === "light" ? "밝은 배경" : "어두운 배경"}</span>
    </button>`).join("")}</div>`;
}

// 라디오 묶음: 고른 것만 Tab 으로 닿고, 화살표로 옮겨 고른다. 아무것도 안 골랐으면 첫 칸에 닿는다.
function markThemeOptions(host, selected) {
  const options = [...host.querySelectorAll("[data-theme-option]")];
  options.forEach((b) => {
    b.setAttribute("aria-checked", String(b.dataset.themeOption === selected));
    b.tabIndex = b.dataset.themeOption === selected ? 0 : -1;
  });
  if (!options.some((b) => b.tabIndex === 0) && options[0]) options[0].tabIndex = 0;
}

function bindThemeOptions(host, onPick) {
  const options = [...host.querySelectorAll("[data-theme-option]")];
  options.forEach((b, i) => {
    b.onclick = () => onPick(b.dataset.themeOption);
    b.onkeydown = (e) => {
      const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
      if (!step) return;
      e.preventDefault();
      const next = options[(i + step + options.length) % options.length];
      next.focus();
      onPick(next.dataset.themeOption);
    };
  });
}

// 처음 시작할 때(새 프로필 · 시작 안내가 켜진 상태) 아직 테마를 안 골랐으면 고르게 한다.
async function firstRunTheme() {
  if (themeChoice()) return;
  try {
    const s = await api("/api/starter");
    if (s.visible && !document.querySelector("dialog[open]")) await chooseThemeFirst();
  } catch { /* 고르지 않아도 Windows 설정을 따라 그대로 쓴다 */ }
}

function chooseThemeFirst() {
  return new Promise((resolve) => {
    const dialog = $("#themeChooser"), host = $("#themeChooserOptions");
    let picked = currentTheme();      // 처음엔 지금 보이는 색(Windows 설정)이 골라져 있다
    host.innerHTML = themeOptionsHTML();
    const pick = (theme) => { picked = theme; previewTheme(theme); markThemeOptions(host, theme); };
    bindThemeOptions(host, pick);
    pick(picked);
    const finish = async () => {
      if (!dialog.open) return;
      dialog.close();
      await saveTheme(picked);
      resolve();
    };
    $("#themeChooserDone").onclick = finish;
    dialog.oncancel = (e) => { e.preventDefault(); finish(); };   // Esc: 지금 보이는 테마로 시작
    dialog.showModal();
    host.querySelector('[aria-checked="true"]')?.focus();
  });
}

// ---------------------------------------------------------------- 고정
function paintPin() {
  const pinned = !!state.memo?.pinned, button = $("#dPin");
  button.setAttribute("aria-pressed", String(pinned));
  button.textContent = pinned ? "📌 고정됨" : "📌 고정";
  button.title = pinned ? "고정을 풉니다" : "메모 목록 맨 위에 고정합니다";
}

async function setPinned(id, pinned) {
  try {
    const memo = await api(`/api/memos/${id}`, { method: "PATCH", body: { pinned } });
    if (state.memo?.id === id) { state.memo.pinned = memo.pinned; paintPin(); }
    toast(pinned ? "메모 목록 맨 위에 고정했습니다" : "고정을 풀었습니다");
    render();
  } catch (e) { toast("고정하지 못했습니다: " + e.message); }
}
$("#dPin").onclick = () => state.memo && setPinned(state.memo.id, !state.memo.pinned);

// ---------------------------------------------------------------- 본문 링크
// 본문의 http(s) 주소를 칩으로 보여 주고 누르면 브라우저로 연다(데스크톱 창도 새 창 링크는 기본 브라우저로 연다).
// 지금 편집 중인 글 기준이라 고치는 동안에도 바로 맞춰진다.
function memoLinks(text) {
  const out = [];
  for (const raw of String(text || "").match(/https?:\/\/[^\s<>"'`]+/gi) || []) {
    let url = raw.replace(/[.,;:!?'"」』>…\]}]+$/u, "");
    // 'https://a.com/x_(y)' 는 살리고 '(https://a.com)' 의 닫는 괄호만 뗀다
    const count = (s, ch) => s.split(ch).length - 1;
    while (url.endsWith(")") && count(url, "(") < count(url, ")")) url = url.slice(0, -1).replace(/[.,;:!?]+$/, "");
    // 'https://example.com에서' — 경로 없는 주소 바로 뒤에 붙은 조사는 뗀다
    url = url.replace(/^(https?:\/\/[^/?#]*?[A-Za-z0-9])[가-힣]+$/u, "$1");
    let parsed;
    try { parsed = new URL(url); } catch { continue; }
    if (!/^https?:$/.test(parsed.protocol) || !parsed.hostname) continue;
    if (!out.some((u) => u.href === parsed.href)) out.push(parsed);
    if (out.length >= 20) break;
  }
  return out;
}

function linkLabel(url) {
  let path = url.pathname === "/" ? "" : url.pathname;
  try { path = decodeURIComponent(path); } catch { /* 깨진 인코딩은 그대로 */ }
  const label = url.hostname.replace(/^www\./, "") + path + (url.search ? "?…" : "");
  return label.length > 48 ? label.slice(0, 47) + "…" : label;
}

function paintLinks() {
  const links = memoLinks($("#dBody").value), box = $("#dLinks");
  box.hidden = !links.length;
  box.innerHTML = links.length ? `<span class="meta">링크</span>` + links.map((u) =>
    `<a class="badge link" href="${esc(u.href)}" target="_blank" rel="noopener noreferrer"
        title="${esc(u.href)} — 브라우저로 열기">🔗 ${esc(linkLabel(u))}</a>`).join("") : "";
}

// ---------------------------------------------------------------- 휴지통
async function restoreMemo(id) {
  try {
    const memo = await api(`/api/trash/${id}/restore`, { method: "POST" });
    toast("메모를 되살렸습니다", { label: "열기", run: () => openMemo(memo.id) });
    render(); loadSidebar(); loadTags();
    return memo;
  } catch (e) { toast("되살리지 못했습니다: " + e.message); return null; }
}

async function renderTrash(version = renderVersion) {
  const d = await api("/api/trash");
  if (version !== renderVersion) return;
  const view = $("#view");
  if (!d.items.length) {
    view.innerHTML = `<div class="empty">휴지통이 비어 있습니다.<br/><span style="font-size:14px">메모를 지우면 ${d.keep_days}일 동안 여기 보관됩니다.</span></div>`;
    return;
  }
  view.innerHTML = `<div class="row"><span class="status">${d.items.length}건 · 지운 날로부터 ${d.keep_days}일이 지나면 완전히 지워집니다.</span>
      <span class="spacer"></span><button class="btn ghost" type="button" id="emptyTrash" style="color:var(--danger)">휴지통 비우기</button></div>`
    + d.items.map((m) => `<div class="card trash-card" data-trash="${m.id}">
      <div class="card-h"><span class="card-title">${esc(m.title)}</span><span class="meta">지운 날 ${fmt(m.deleted_at)}</span></div>
      <div class="snip">${esc(m.body.length > 200 ? m.body.slice(0, 200) + "…" : m.body)}</div>
      ${m.body.length > 200 ? `<details><summary class="meta">전체 내용 보기</summary><div class="doc">${esc(m.body)}</div></details>` : ""}
      <div class="row" style="margin:8px 0 0"><span class="meta">작성 ${fmt(m.created_at)} · ${m.days_left}일 뒤 완전히 삭제</span><span class="spacer"></span>
        <button class="btn" type="button" data-restore="${m.id}">되살리기</button>
        <button class="btn ghost" type="button" data-purge="${m.id}" style="color:var(--danger)">완전히 삭제</button></div>
    </div>`).join("");
  view.querySelectorAll("[data-restore]").forEach((b) => {
    b.onclick = async () => { b.disabled = true; if (!await restoreMemo(+b.dataset.restore)) b.disabled = false; };
  });
  view.querySelectorAll("[data-purge]").forEach((b) => {
    b.onclick = async () => {
      const item = d.items.find((m) => m.id === +b.dataset.purge);
      if (!confirm(`‘${item.title}’ 메모를 완전히 지울까요? 되돌릴 수 없습니다.`)) return;
      try { await api(`/api/trash/${item.id}`, { method: "DELETE" }); toast("완전히 지웠습니다"); render(); }
      catch (e) { toast("지우지 못했습니다: " + e.message); }
    };
  });
  $("#emptyTrash").onclick = async () => {
    if (!confirm(`휴지통의 메모 ${d.items.length}건을 모두 완전히 지울까요? 되돌릴 수 없습니다.`)) return;
    try { const r = await api("/api/trash", { method: "DELETE" }); toast(`${r.deleted}건을 완전히 지웠습니다`); render(); }
    catch (e) { toast("휴지통을 비우지 못했습니다: " + e.message); }
  };
}
$("#dPack").onclick = () => {
  if (gen.busy) { toast("진행 중인 생성이 끝난 뒤 다시 시도하세요"); return; }
  const m = state.memo, collection = $("#dCollection").dataset.id;
  if (!closeDetail()) return;
  if (collection) colStartAi(+collection);
  else startGenerate([m.id], `"${m.title}" 내용을 정리해줘`);
};
$("#dCollection").onclick = () => {
  const id = +$("#dCollection").dataset.id;
  if (id && closeDetail()) colOpen(id);
};

document.addEventListener("keydown", (e) => {
  if (e.key === "/" && !document.querySelector("dialog[open]") && !["TEXTAREA", "INPUT", "SELECT"].includes(document.activeElement.tagName)) {
    e.preventDefault();
    goTab("feed"); $("#q").focus();
  }
});
window.addEventListener("beforeunload", (e) => {
  localDraft($("#capture").value);
  if (genDirty() || gen.busy || detailDirty() || docImport.dirty || docImport.saving || $("#capture").value !== draftSaved || captureSaving
      || col.upload || col.preview || todoAi.busy || calendarEntry.busy || calendarEntry.dirty) {
    e.preventDefault(); e.returnValue = "";
  }
});

async function bindQuickCapture() {
  const bridge = window.pywebview?.api;
  if (!bridge?.quick_capture_status) return;
  const button = $("#quickCapture");
  try {
    const {shortcut} = await bridge.quick_capture_status();
    button.textContent = shortcut ? "빠른 메모 · " + shortcut : "빠른 메모";
    button.title = shortcut ? "다른 앱에서도 " + shortcut + "로 빠른 메모 열기" : "전역 단축키를 등록할 수 없습니다. 여기를 눌러 빠른 메모를 여세요.";
    button.onclick = () => bridge.open_quick_capture().catch((error) => toast(error.message));
    button.hidden = false;
  } catch (error) { toast("빠른 메모를 준비하지 못했습니다"); }
}
window.addEventListener("pywebviewready", bindQuickCapture);
bindQuickCapture();
window.addEventListener("quick-memo-saved", (event) => {
  if (event.detail === state.memo?.id && $("#detail").open && !detailDirty()) {
    openMemo(event.detail, null, true);
  }
  if (state.tab === "feed") render();
  if (state.tab === "todos" && todoBoard.layout === "calendar") refreshTodoBoard();
  loadSidebar(); loadTags();
});

renderTabs();
bindSearchTools();
const starterTour = setupStarterTour();
// 처음 시작하면 화면 테마부터 고르고, 그다음 튜토리얼을 연다.
firstRunTheme().then(() => starterTour.firstRun());
const firstSidebar = loadSidebar().catch((e) => toast("상태를 불러오지 못했습니다: " + e.message));
loadTags();
const firstRender = render();
restoreDraft();
setInterval(() => loadSidebar().catch(() => {}), 6000);

// 항상 위에 띄워 둔 메모 창(데스크톱 앱)은 메인 화면이 다 그려진 뒤에 다시 연다.
// 앱이 그리고 있는 동안 창이 먼저 튀어나와 시작을 늦추거나 첫 입력을 가로채지 않게 한다.
// 실제로 여는 일(잠시 쉬었다가 하나씩, 포커스는 그대로)은 데스크톱 쪽이 한다. 한 번만 부른다.
const firstPaint = Promise.allSettled([firstSidebar, firstRender]);
let memoWindowsRestoring = false;
async function restoreMemoWindows() {
  if (memoWindowsRestoring || !window.pywebview?.api?.restore_memo_windows) return;
  memoWindowsRestoring = true;
  await firstPaint;
  // 처음 그리는 도중 다른 화면 그리기가 이어졌으면(시작 안내 등) 그것까지 끝난 뒤. 10초 넘게 걸리면 더 기다리지 않는다.
  for (let waited = 0; rendersInFlight && waited < 10000; waited += 100) await new Promise((r) => setTimeout(r, 100));
  await new Promise((resolve) => requestAnimationFrame(() => setTimeout(resolve, 0)));   // 그린 화면이 실제로 표시된 뒤
  try { await window.pywebview.api.restore_memo_windows(); }
  catch { /* 창을 못 열어도 메인 화면은 그대로 쓴다 */ }
}
window.addEventListener("pywebviewready", restoreMemoWindows);
restoreMemoWindows();
</script>
