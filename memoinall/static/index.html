function resetRow(x) {
  const st = x.stored || { memos: 0 };
  if (!st.memos) {
    return `<div class="meta" style="margin-top:8px">아직 이 앱에서 가져온 메모가 없습니다.</div>`;
  }
  const span = st.first ? ` <span class="meta">· ${esc(st.first)} ~ ${esc(st.last)}</span>` : "";
  return `<div class="row" style="margin-top:8px;gap:8px">
      <span class="meta">가져와 있는 메모 <b style="color:var(--fg)">${st.memos}건</b>${span}</span>
      <span class="spacer"></span>
      <button class="btn ghost" data-src-reset="${x.name}" data-n="${st.memos}"
              style="color:var(--danger)">전부 삭제</button>
    </div>
    <div id="impReset-${x.name}"></div>`;
}

function askReset(name, n) {
  const el = $(`#impReset-${name}`);
  if (!el) return;
  // 한 번 더 묻는다 — 되돌릴 수 없는데다, 지우는 양이 클수록 오조작 대가가 크다.
  el.innerHTML = `<div style="margin-top:9px;padding:10px 12px;border:1px solid var(--danger);border-radius:8px">
      <div><b style="color:var(--danger)">${esc(name)} 에서 가져온 메모 ${n}건을 지웁니다.</b></div>
      <div class="note" style="margin-top:4px">
        딸린 할 일·태그·임베딩도 같이 지워지고, memoinall 안에서 고친 내용도 사라집니다.
        <b>되돌릴 수 없습니다.</b> 직접 쓴 메모와 다른 앱에서 가져온 메모는 그대로 둡니다.
      </div>
      <div class="row" style="margin-top:10px">
        <span class="spacer"></span>
        <button class="btn" data-reset-cancel>취소</button>
        <button class="btn primary" data-reset-go
                style="background:var(--danger);border-color:var(--danger)">${n}건 지우기</button>
      </div>
    </div>`;
  el.querySelector("[data-reset-cancel]").onclick = () => { el.innerHTML = ""; };
  el.querySelector("[data-reset-go]").onclick = () => doReset(name, el);
}

async function doReset(name, el) {
  el.innerHTML = `<div class="status" style="margin-top:9px">지우는 중…</div>`;
  try {
    const r = await api("/api/import/reset", { method: "POST", body: { source: name, confirm: true } });
    delete imp.results[name];  // 지워진 데이터의 옛 가져오기 결과가 남아 있으면 오해를 부른다
    toast(r.deleted ? `${name} 메모 ${r.deleted}건을 지웠습니다` : "지울 메모가 없었습니다");
    loadSidebar();
    render();
  } catch (err) {
    el.innerHTML = `<div class="status" style="color:var(--danger);margin-top:9px">${esc(err.message)}</div>`;
  }
}

  if (imp.sharedContent) {
    const shared = sources.find((x) => x.name === "shared");
    Object.assign(shared, { available: true, path: imp.sharedName });

      <details class="notion-guide" ${s["import.notion.token"].configured ? "" : "open"}>
        <summary>처음이라면: 토큰 만들고 페이지 연결하기 (약 5분)</summary>
        <ol>
          <li><b>연결 만들기</b> — 브라우저에서
            <a href="https://app.notion.com/developers/connections" target="_blank" rel="noopener noreferrer">Notion 개발자 페이지</a>를 열고
            <b>New connection</b>을 누릅니다. 이름(예: memoinall)을 적고, 인증 방식은 <b>API token</b>,
            워크스페이스는 가져올 곳을 고른 뒤 만듭니다.
            <div class="note">워크스페이스 <b>소유자(Owner)</b>만 만들 수 있습니다. Business·Enterprise 요금제는 소유자가 허용하면
              멤버도 만들 수 있습니다. 버튼이 없거나 막혀 있으면 소유자에게 <b>‘내용 읽기만 되는 연결 토큰’</b>을 요청하세요.</div></li>
          <li><b>읽기 권한만 켜기</b> — 만든 연결의 <b>Configuration</b> 탭에서 권한(Capabilities)은
            <b>내용 읽기(Read content)</b>만 남깁니다. memoinall은 읽기만 합니다.</li>
          <li><b>토큰 복사</b> — 같은 탭의 <b>API token</b>을 복사해 아래 <b>토큰</b> 칸에 붙여 넣습니다.
            보통 <code>ntn_</code> 또는 <code>secret_</code>으로 시작합니다.</li>
          <li><b>가져올 페이지에 연결 추가</b> — Notion에서 가져올 페이지를 열고 오른쪽 위 <b>•••</b> → <b>연결(Connections)</b>에서
            방금 만든 연결을 고릅니다. <b>상위 페이지 하나에만 추가해도 그 아래 하위 페이지가 모두</b> 포함됩니다.
            개발자 페이지의 <b>Content access</b> 탭 → <b>Edit access</b>에서 한꺼번에 고를 수도 있습니다.</li>
          <li><b>확인하고 가져오기</b> — <b>연결 테스트</b>로 읽을 수 있는 페이지 수를 확인한 뒤 <b>미리보기</b> → <b>가져오기</b>를 누르세요.
            나중에 Notion에서 고친 내용을 반영하려면 <b>가져오기 옵션 (선택)</b>의 <b>이미 가져온 메모도 갱신</b>을 켜고 다시 가져오세요.</li>
        </ol>
        <div class="note">Notion 화면의 메뉴 이름은 언어·버전에 따라 조금 다를 수 있습니다.</div>
      </details>

        <button class="btn" data-src-preview="notion">미리보기</button>
        <button class="btn primary" data-src-run="notion">가져오기</button>
      </div>

      ${resetRow(byName.notion)}
      <div id="impOut-notion"></div>
      </div>
    </details>`;
  $("#view").appendChild($("#importOptions"));

  }

  $("#impPath").onchange = (e) => { imp.path = e.target.value.trim(); render(); };
  $("#impShared").onchange = (e) => {
    sharedLoadVersion++;
    imp.sharedPath = e.target.value.trim(); imp.sharedContent = imp.sharedName = "";
    if (imp.sharedViaQr) imp.sharedPassword = "";
    imp.sharedLocked = imp.sharedViaQr = false;
    delete importReviews.shared;
    delete imp.results.shared; render();
  };
  $("#sharedFile").onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (imp.busy) { e.target.value = ""; toast("진행 중인 가져오기가 끝난 뒤 파일을 선택하세요"); return; }
    await loadShared(async () => {
      if (file.size > 50000000) throw new Error("50MB 이하의 메모 파일을 선택하세요.");
      return (await file.text()).replace(/^\uFEFF/, "");
    }, file.name, { what: "파일", fail: () => { e.target.value = ""; } });
  };
  $("#sharedQr").onclick = () => {
    if (imp.busy) { toast("진행 중인 가져오기가 끝난 뒤 QR을 찍으세요"); return; }
    scanQrDialog((text) => (qrPayloadKind(text) === "schedules"
      ? receiveSchedules(text)
      : loadShared(async () => text, "QR로 받은 메모", { what: "QR" })));
  };
  $("#mobileInstall").onclick = showInstallQr;
  $("#impSharedPw").value = imp.sharedPassword;
  $("#impSharedPw").onchange = async (e) => {
    imp.sharedPassword = e.target.value;
    delete imp.results.shared;
    if (!imp.sharedContent) return;   // 경로로 지정한 파일은 미리보기 버튼에서 같이 보낸다
    const status = $(imp.sharedViaQr ? "#sharedQrStatus" : "#sharedFileStatus");
    try { await openShared(imp.sharedContent, imp.sharedName, status, imp.sharedViaQr); }
    catch (err) { if (status.isConnected) status.textContent = err.message; }
  };

  $("#expPw2").value = expSecret.confirm;
  $("#expPw").oninput = (e) => { expSecret.password = e.target.value; };
  $("#expPw2").oninput = (e) => { expSecret.confirm = e.target.value; };

    document.querySelectorAll("#expTagRow button").forEach((b) => { b.disabled = true; });
  }
  $("#expQ").onchange = (e) => { exp.q = e.target.value.trim(); };
  document.querySelectorAll("#expTagRow [data-tag]").forEach((b) => {
    b.onclick = () => {
      const n = b.dataset.tag;
      exp.tags = exp.tags.includes(n) ? exp.tags.filter((t) => t !== n) : [...exp.tags, n];
      b.classList.toggle("on");
    };
  });
  document.querySelectorAll("#impTagRow [data-tag]").forEach((b) => {

function paintExchangeSection() {

  });
  document.querySelectorAll("[data-exchange-tab]").forEach((b) => {
    const active = b.dataset.exchangeTab === imp.section;
    b.classList.toggle("on", active);
    b.setAttribute("aria-pressed", String(active));
  });
}

async function previewDocument(file) {
  if (docImport.busy) return;
  if (docImport.dirty && !confirm("미리보기에서 수정한 내용을 버리고 새 파일을 열까요?")) {
    if ($("#documentFile")) $("#documentFile").value = "";
    return;
  }
  Object.assign(docImport, { preview: null, selected: new Set(), edits: new Map(), result: null, dirty: false, error: "", busy: true });
  paintDocumentPreview();
  try {
    if (file.size > 20000000) throw new Error("20MB 이하의 파일을 선택하세요.");
    const p = await api("/api/import/documents/preview?" + new URLSearchParams({ filename: file.name }), {
      method: "POST", headers: { "Content-Type": "application/octet-stream" }, rawBody: file,
    });
    docImport.preview = p;
    docImport.selected = new Set(p.parts.map((part) => part.key));
  } catch (e) { docImport.error = e.message; }
  finally { docImport.busy = false; paintDocumentPreview(); starterTour.refresh(); }
}

function documentParts() {
  return (docImport.preview?.parts || []).filter((p) => docImport.selected.has(p.key)).map((p) => ({
    ...p, text: docImport.edits.has(p.key) ? docImport.edits.get(p.key) : p.text,
  }));
}

function updateDocumentSave() {
  const button = $("#documentSave");
  if (!button) return;
  const parts = documentParts();
  button.textContent = docImport.saving ? "저장 중…" : `선택한 ${parts.length}개를 메모로 저장`;
  button.disabled = docImport.busy || !parts.length || parts.some((p) => !p.text.trim());
}

function paintDocumentPreview() {
  const target = $("#documentPreview");
  if (!target) return;
  $("#documentFile").disabled = docImport.busy;
  $("#chooseDocument").disabled = docImport.busy;
  $("#chooseDocument").textContent = docImport.preview ? "다른 파일 선택" : "파일 선택";
  if (docImport.busy && !docImport.preview) { target.innerHTML = '<div class="status">파일에서 텍스트를 읽는 중…</div>'; return; }
  const p = docImport.preview;
  if (!p) {
    target.innerHTML = `<div class="status">${docImport.error ? esc(docImport.error) : "지원: 엑셀(XLSX·XLSM·XLS), PDF, 한글(HWP·HWPX), TXT·MD. 스캔·이미지 문서는 OCR이 필요합니다."}</div>`;
    return;
  }
  target.innerHTML = `<div style="margin-top:12px">
    <div><b>${esc(p.filename)}</b> <span class="meta">· ${p.parts.length}개 부분 · ${p.chars.toLocaleString()}자</span></div>
    <div class="status">미리보기입니다. 필요한 부분을 고르고 내용을 확인한 뒤 메모로 저장하세요.</div>
    ${p.warnings.map((w) => `<div class="status" style="color:var(--warn);margin-top:4px">${esc(w)}</div>`).join("")}
    <div class="row" style="margin-top:10px">
      <button class="btn ghost" id="documentAll" ${docImport.busy ? "disabled" : ""}>모두 선택</button>
      <button class="btn ghost" id="documentNone" ${docImport.busy ? "disabled" : ""}>선택 해제</button>
    </div>
    <div style="max-height:420px;overflow:auto">
      ${p.parts.map((part, i) => `<details class="cluster" ${i === 0 ? "open" : ""}>
        <summary><label><input type="checkbox" data-document-part="${i}" ${docImport.selected.has(part.key) ? "checked" : ""} ${docImport.busy ? "disabled" : ""} /> ${esc(part.label)}</label></summary>
        <textarea class="gen-input" data-document-text="${i}" aria-label="${esc(part.label)} 추출 텍스트" ${docImport.busy ? "disabled" : ""} style="margin-top:8px;min-height:120px">${esc(docImport.edits.has(part.key) ? docImport.edits.get(part.key) : part.text)}</textarea>
      </details>`).join("")}
    </div>
    ${docImport.error ? `<div class="status" style="color:var(--danger)">${esc(docImport.error)}</div>` : ""}
    <div class="row" style="margin:12px 0 0"><span class="spacer"></span><button class="btn primary" id="documentSave"></button></div>
    <div id="documentResult" style="margin-top:10px"></div>
  </div>`;
  target.querySelectorAll("[data-document-part]").forEach((c) => {
    c.closest("label").onclick = (e) => e.stopPropagation();
    c.onchange = () => {
      const key = p.parts[+c.dataset.documentPart].key;
      if (c.checked) docImport.selected.add(key); else docImport.selected.delete(key);
      updateDocumentSave();
    };
  });
  target.querySelectorAll("[data-document-text]").forEach((ta) => {
    ta.oninput = () => { docImport.edits.set(p.parts[+ta.dataset.documentText].key, ta.value); docImport.dirty = true; updateDocumentSave(); };
  });
  $("#documentAll").onclick = () => { docImport.selected = new Set(p.parts.map((part) => part.key)); paintDocumentPreview(); };
  $("#documentNone").onclick = () => { docImport.selected.clear(); paintDocumentPreview(); };
  $("#documentSave").onclick = saveDocument;
  updateDocumentSave();
  if (docImport.result) paintDocumentResult();
  if (!docImport.busy) starterTour.refresh();
}

async function saveDocument() {
  if (docImport.busy || !docImport.preview) return;
  const parts = documentParts();
  if (!parts.length || parts.some((p) => !p.text.trim())) { toast("저장할 부분을 고르고 내용을 입력하세요"); return; }
  docImport.busy = docImport.saving = true;
  docImport.error = "";
  paintDocumentPreview();
  try {
    docImport.result = await api("/api/import/documents/save", { method: "POST", body: { filename: docImport.preview.filename, parts } });
    docImport.dirty = false;
    await Promise.allSettled([loadSidebar(), loadTags()]);
  } catch (e) { docImport.error = "저장 실패: " + e.message; }
  finally { docImport.busy = docImport.saving = false; paintDocumentPreview(); }
}

function paintDocumentResult() {
  const target = $("#documentResult"), r = docImport.result;
  if (!target || !r) return;
  target.innerHTML = `<div class="status">${r.imported}개 메모를 저장했습니다${r.skipped_duplicate ? ` · 이미 저장된 내용 ${r.skipped_duplicate}개는 건너뛰었습니다` : ""}. 검색과 AI 활용이 가능합니다.</div>
    <div class="row" style="margin-top:8px"><button class="btn" id="documentGenerate">이 자료로 문서 만들기</button></div>
    <details><summary class="status">저장한 메모 확인</summary>${r.memos.map((m) =>
      `<button class="btn ghost" data-document-memo="${m.id}" style="display:block;text-align:left;white-space:normal">${esc(m.title)}</button>`).join("")}</details>`;
  $("#documentGenerate").onclick = () => startGenerate(r.memos.map((m) => m.id), "가져온 문서를 바탕으로 핵심 내용과 할 일을 정리해줘");
  target.querySelectorAll("[data-document-memo]").forEach((b) => { b.onclick = () => openMemo(+b.dataset.documentMemo); });
}

// 받은 내용(파일·QR)을 새로 고른 것으로 놓고 미리보기까지. 앞서 고른 것의 결과는 버린다.
async function loadShared(read, name, { what = "파일", fail = null } = {}) {
  const version = ++sharedLoadVersion;
  const viaQr = what === "QR";
  if (viaQr || imp.sharedViaQr) {
    imp.sharedPassword = "";
    $("#impSharedPw").value = "";
  }
  imp.sharedContent = imp.sharedName = imp.sharedPath = "";
  delete imp.results.shared;
  delete importReviews.shared;
  if ($("#impOut-shared")) $("#impOut-shared").textContent = "";
  document.querySelectorAll('[data-src-run="shared"], [data-src-preview="shared"]').forEach((b) => { b.disabled = true; });
  const status = $(viaQr ? "#sharedQrStatus" : "#sharedFileStatus");
  try {
    const content = await read();
    if (version !== sharedLoadVersion) return;
    await openShared(content, name, status, viaQr, version);
  } catch (err) {
    if (fail) fail();
    if (version === sharedLoadVersion && status?.isConnected) status.textContent = `${what} 확인 실패: ${err.message}`;
  }
}

// ---------------------------------------------------------------- QR (휴대폰 앱 → PC)
// 휴대폰 앱이 띄운 QR 을 웹캠으로 받기만 한다. 사내 정보 보호를 위해 PC 는 메모를 QR 로 만들지 않는다(한 방향).
// 닫으면 카메라를 끈다.
function qrDialog(title) {
  let dlg = $("#qrDlg");
  if (!dlg) {
    dlg = document.createElement("dialog");
    dlg.id = "qrDlg";
    dlg.setAttribute("aria-labelledby", "qrDlgTitle");
    dlg.style.width = "min(520px, 94vw)";
    dlg.innerHTML = `<div class="dlg-h"><span class="card-title" id="qrDlgTitle"></span><span class="spacer"></span>
      <button class="btn ghost" type="button" id="qrDlgClose">닫기</button></div><div class="dlg-b" id="qrDlgBody" style="max-height:82vh"></div>`;
    document.body.appendChild(dlg);
    $("#qrDlgClose").onclick = () => dlg.close();
    dlg.addEventListener("close", () => { if (dlg._stop) dlg._stop(); dlg._stop = null; $("#qrDlgBody").innerHTML = ""; });
  }
  if (dlg._stop) dlg._stop();
  dlg._stop = null;
  $("#qrDlgTitle").textContent = title;
  return dlg;
}

function scanQrDialog(onText) {
  const dlg = qrDialog("휴대폰 QR 찍어서 받기");
  $("#qrDlgBody").innerHTML = `<div id="qrDlgScan"></div>
    <div class="note" style="margin-top:10px">휴대폰 앱에서 메모나 일정을 고르고 <b>PC로 보내기 → QR로 보여주기</b>를 누른 뒤 화면을 웹캠에 비추세요.
      여러 장이면 자동으로 넘어가니 그대로 두면 됩니다.</div>
    <div class="note" style="margin-top:6px">휴대폰 앱이 아직 없다면 <button class="btn ghost" type="button" id="qrToInstall">설치 QR 보기</button></div>`;
  const scan = QrShare.scan($("#qrDlgScan"), {
    onDone: (text) => { dlg.close(); onText(text); },
  });
  dlg._stop = () => scan.stop();
  $("#qrToInstall").onclick = showInstallQr;
  if (!dlg.open) dlg.showModal();
}

// ---------------------------------------------------------------- 휴대폰 일정 받기
// 휴대폰이 보낸 QR 이 메모인지 일정인지. 잠근 일정은 봉투 겉에 kind 가 적혀 온다.
function qrPayloadKind(text) {
  try {
    const d = JSON.parse(text);
    return d && (d.format === "memoinall/schedules" || d.kind === "schedules") ? "schedules" : "memos";
  } catch (_) { return "memos"; }
}

const schedRx = { content: "", password: "", data: null, locked: false, error: "", picked: new Set(), busy: false, result: null };

async function receiveSchedules(content) {
  Object.assign(schedRx, { content, password: "", data: null, locked: false, error: "", picked: new Set(), busy: false, result: null });
  const dlg = qrDialog("휴대폰 일정 받기");
  if (!dlg.open) dlg.showModal();
  await previewSchedules();
}

async function previewSchedules() {
  const body = $("#qrDlgBody");
  if (body) body.innerHTML = '<div class="status">확인하는 중…</div>';
  try {
    const r = await api("/api/schedule/receive/preview", { method: "POST", body: { content: schedRx.content, password: schedRx.password } });
    schedRx.locked = !!r.needs_password;
    schedRx.data = r.needs_password ? null : r;
    schedRx.error = "";
    if (schedRx.data) schedRx.picked = new Set(r.items.filter((x) => !x.exists).map((x) => x.key));
  } catch (err) {
    schedRx.data = null;
    schedRx.error = err.message;
  }
  paintScheduleReceive();
}

function paintScheduleReceive() {
  const body = $("#qrDlgBody");
  if (!body || !$("#qrDlg")?.open) return;
  const d = schedRx.data;
  let html = "";
  if (!d && (schedRx.locked || /비밀번호/.test(schedRx.error))) {
    html += `<div class="note">잠긴 일정입니다. 휴대폰에서 정한 비밀번호를 넣으세요.</div>
      <form id="schedPwForm" class="row" style="margin-top:8px"><input id="schedPw" type="password" autocomplete="off" aria-label="비밀번호" placeholder="비밀번호" style="flex:1" />
        <button class="btn primary" type="submit">열기</button></form>`;
  }
  if (schedRx.error) html += `<div class="status" style="color:var(--danger);margin-top:8px">${esc(schedRx.error)}</div>`;
  if (d) {
    const fresh = d.items.filter((x) => !x.exists).length;
    html += `<div class="note">휴대폰에서 보낸 일정 ${d.items.length}건${d.items.length - fresh ? ` · 이미 받은 ${d.items.length - fresh}건은 빼 두었습니다` : ""}${d.skipped ? ` · 읽을 수 없는 ${d.skipped}건 제외` : ""}.
      고른 일정을 PC 일정에 추가합니다(시각은 이름 앞에, 메모는 함께 저장되는 메모에 들어갑니다).</div>
      <div class="row" style="margin:10px 0 4px"><button class="btn ghost" type="button" id="schedAll">모두 선택</button>
        <button class="btn ghost" type="button" id="schedNone">선택 해제</button></div>
      <div style="max-height:46vh;overflow:auto">${d.items.map((x) => `<label style="display:flex;gap:8px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)">
        <input type="checkbox" data-sched-key="${esc(x.key)}" ${schedRx.picked.has(x.key) ? "checked" : ""} ${x.exists ? "disabled" : ""} />
        <span style="min-width:0"><b style="overflow-wrap:anywhere">${esc(x.title)}</b>
          <span class="meta" style="display:block">${esc(x.date)}${x.time ? " " + esc(x.time) : ""}${x.tags.length ? " · " + x.tags.map((t) => "#" + esc(t)).join(" ") : ""}${x.done ? " · 끝냄" : ""}${x.note ? " · 메모 있음" : ""}${x.exists ? ' · <span style="color:var(--warn)">이미 있음</span>' : ""}</span></span></label>`).join("")
        || '<div class="status">받을 수 있는 일정이 없습니다.</div>'}</div>
      <div class="row" style="margin-top:12px"><span class="spacer"></span>
        <button class="btn primary" type="button" id="schedApply" ${schedRx.picked.size && !schedRx.busy ? "" : "disabled"}>${schedRx.picked.size ? `일정 ${schedRx.picked.size}건 가져오기` : "가져오기"}</button></div>`;
  }
  if (schedRx.result) {
    html += `<div class="status" style="margin-top:10px">일정 ${schedRx.result.imported}건을 추가했습니다${schedRx.result.skipped_existing ? ` · 이미 있던 ${schedRx.result.skipped_existing}건은 건너뛰었습니다` : ""}.
      <button class="btn" type="button" id="schedOpen" style="margin-left:6px">일정에서 보기</button></div>`;
  }
  body.innerHTML = html;
  const form = $("#schedPwForm");
  if (form) {
    form.onsubmit = (e) => { e.preventDefault(); schedRx.password = $("#schedPw").value; if (schedRx.password) previewSchedules(); };
    setTimeout(() => $("#schedPw")?.focus(), 30);
  }
  body.querySelectorAll("[data-sched-key]").forEach((c) => {
    c.onchange = () => { c.checked ? schedRx.picked.add(c.dataset.schedKey) : schedRx.picked.delete(c.dataset.schedKey); paintScheduleReceive(); };
  });
  if ($("#schedAll")) $("#schedAll").onclick = () => { d.items.filter((x) => !x.exists).forEach((x) => schedRx.picked.add(x.key)); paintScheduleReceive(); };
  if ($("#schedNone")) $("#schedNone").onclick = () => { schedRx.picked.clear(); paintScheduleReceive(); };
  if ($("#schedApply")) $("#schedApply").onclick = applySchedules;
  if ($("#schedOpen")) $("#schedOpen").onclick = () => { $("#qrDlg").close(); goTab("todos"); };
}

async function applySchedules() {
  if (schedRx.busy || !schedRx.picked.size) return;
  schedRx.busy = true;
  paintScheduleReceive();
  try {
    const r = await api("/api/schedule/receive/apply", { method: "POST",
      body: { content: schedRx.content, password: schedRx.password, selected: [...schedRx.picked] } });
    toast(`일정 ${r.imported}건을 추가했습니다`);
    schedRx.busy = false;
    await previewSchedules();          // 방금 넣은 것은 '이미 있음'으로 바뀐다
    schedRx.result = r;
    paintScheduleReceive();
  } catch (err) {
    schedRx.busy = false;
    schedRx.error = err.message;
    paintScheduleReceive();
  }
}

// ---------------------------------------------------------------- 휴대폰 앱 설치 QR
// QR 에는 휴대폰 앱 주소(설정 mobile.url)만 담는다 — 메모는 담지 않는다.
// QR 을 그리는 라이브러리는 이 창을 열 때만 싣는다. 메모를 QR 로 내보내는 화면은 PC 에 없다.
let qrLibLoading = null;
function loadQrLib() {
  if (typeof qrcode === "function") return Promise.resolve();
  if (!qrLibLoading) {
    qrLibLoading = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "/static/vendor/qrcode.js";
      s.onload = () => (typeof qrcode === "function" ? resolve() : reject(new Error("QR 모듈을 불러오지 못했습니다.")));
      s.onerror = () => { qrLibLoading = null; reject(new Error("QR 모듈을 불러오지 못했습니다.")); };
      document.head.appendChild(s);
    });
  }
  return qrLibLoading;
}

function drawUrlQr(canvas, url) {
  const q = qrcode(0, "M");
  q.addData(url, "Byte");
  q.make();
  const n = q.getModuleCount(), quiet = 4, scale = Math.max(4, Math.floor(480 / (n + quiet * 2)));
  canvas.width = canvas.height = (n + quiet * 2) * scale;
  const g = canvas.getContext("2d");
  g.fillStyle = "#fff";
  g.fillRect(0, 0, canvas.width, canvas.height);
  g.fillStyle = "#000";
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) if (q.isDark(y, x)) g.fillRect((x + quiet) * scale, (y + quiet) * scale, scale, scale);
  }
}

async function showInstallQr() {
  const dlg = qrDialog("휴대폰 앱 설치");
  $("#qrDlgBody").innerHTML = '<div class="status">불러오는 중…</div>';
  if (!dlg.open) dlg.showModal();
  try {
    const [s] = await Promise.all([api("/api/settings"), loadQrLib()]);
    if (dlg.open) paintInstallQr(s.settings["mobile.url"]);
  } catch (err) {
    $("#qrDlgBody").innerHTML = `<div class="status" style="color:var(--danger)">${esc(err.message)}</div>`;
  }
}

function paintInstallQr(entry, { editing = false } = {}) {

  $("#qrDlgBody").innerHTML = `
    <div class="note">휴대폰 카메라로 이 QR을 찍으면 설치 주소가 열립니다. QR에는 <b>주소만</b> 들어 있고 메모는 들어 있지 않습니다.</div>
    <canvas id="installQr" role="img" aria-label="휴대폰 앱 설치 주소 QR"
      style="display:block;width:min(100%,260px);aspect-ratio:1;image-rendering:pixelated;margin:14px auto;border-radius:8px;background:#fff"></canvas>
    <div class="row" style="justify-content:center;margin:0 0 12px"><span id="installUrl" style="overflow-wrap:anywhere">${esc(url)}</span>
      <button class="btn ghost" type="button" id="installCopy">주소 복사</button></div>
    <ol class="note" style="margin:0 0 12px;padding-left:20px">
      <li><b>Android</b>(Chrome·삼성 인터넷): 열린 화면 위쪽의 <b>홈 화면에 설치</b>를 누르거나, 브라우저 메뉴(⋮) → <b>앱 설치</b>.</li>
      <li><b>iPhone</b>: <b>Safari</b>로 열고 공유 버튼 → <b>홈 화면에 추가</b>.</li>
      <li>카카오톡·네이버 앱 안에서 열렸다면 <b>다른 브라우저로 열기</b>를 먼저 누르세요. 앱 안의 브라우저는 설치를 지원하지 않습니다.</li>
    </ol>
    <details id="installUrlEdit" ${editing ? "open" : ""}><summary class="status">주소 바꾸기</summary>
      <form id="installUrlForm" class="row" style="margin-top:8px">
        <input id="installUrlInput" value="${esc(url)}" aria-label="휴대폰 앱 주소" style="flex:1;min-width:220px" />
        <button class="btn" type="submit">저장</button>
        <button class="btn ghost" type="button" id="installUrlReset" ${entry.source === "기본값" ? "hidden" : ""}>기본 주소로</button>
      </form>
      <div class="note" id="installUrlNote">${entry.source === "기본값" ? "기본 주소를 쓰고 있습니다." : `기본 주소: ${esc(entry.default)}`}</div>
    </details>`;
  drawUrlQr($("#installQr"), url);
  $("#installCopy").onclick = () => { navigator.clipboard.writeText(url); toast("주소를 복사했습니다"); };
  const save = async (value) => {
    try {
      const r = await api("/api/settings", { method: "PUT", body: { values: { "mobile.url": value } } });
      paintInstallQr(r.settings["mobile.url"], { editing: true });
      toast("휴대폰 앱 주소를 저장했습니다");
    } catch (err) {
      $("#installUrlNote").textContent = err.message;
      $("#installUrlNote").style.color = "var(--danger)";
    }
  };
  $("#installUrlForm").onsubmit = (e) => { e.preventDefault(); save($("#installUrlInput").value.trim()); };
  $("#installUrlReset").onclick = () => save("");
}

// 고른 파일의 겉면을 확인하고 미리보기까지. 암호화된 파일이면 비밀번호를 받을 때까지 멈춘다.
async function openShared(content, name, status, viaQr, version = ++sharedLoadVersion) {
  const info = await api("/api/import/shared/describe", {
    method: "POST", body: { content, password: imp.sharedPassword || null },
  });
  if (version !== sharedLoadVersion || !status.isConnected) return;
  Object.assign(imp, { sharedContent: content, sharedName: name, sharedPath: "", sharedViaQr: viaQr, sharedLocked: !!info.needs_password });
  delete imp.results.shared;
  delete importReviews.shared;
  if (!info.needs_password) {
    toast(`${name} · 메모 ${info.count}건${info.encrypted ? " · 암호 해제됨" : ""}${info.note ? " · " + info.note : ""}`);
  }
  if (!status.isConnected) return;
  await render();
  if (info.needs_password) { $("#impSharedPw")?.focus(); return; }
  await doImport(true, "shared");
}

// A shared, paginated picker keeps checks across searches and pages.
function memoPicker(target, review, changed = () => {}) {
  if (!target) return;
  target.innerHTML = `<div style="margin-top:12px;padding:12px;background:var(--panel-2);border-radius:8px">
    <div class="row"><input type="search" data-picker-search aria-label="목록에서 제목·본문 검색" placeholder="목록에서 제목·본문 검색" style="flex:1" />
      <label class="status"><input type="checkbox" data-picker-only /> 선택한 메모만</label></div>
    <div class="row" style="margin:8px 0"><button class="btn" data-picker-all>검색 결과 선택</button>
      <button class="btn" data-picker-none>검색 결과 해제</button><span class="status" data-picker-count aria-live="polite"></span></div>
    <div data-picker-list style="max-height:410px;overflow:auto"></div>
    <div class="row" style="margin-top:8px"><button class="btn" data-picker-prev>이전</button>
      <span class="status" data-picker-page></span><button class="btn" data-picker-next>다음</button></div></div>`;
  let offset = 0;
  const expanded = new Set();
  const find = (s) => target.querySelector(s);
  const matches = () => {
    const q = find("[data-picker-search]").value.trim().toLocaleLowerCase();
    return review.items.filter((m) => (!find("[data-picker-only]").checked || review.selected.has(m.key)) &&
      (!q || `${m.title}\n${m.body}`.toLocaleLowerCase().includes(q)));
  };
  function draw() {
    const rows = matches();
    const list = find("[data-picker-list]");
    const scroll = list.scrollTop, focused = document.activeElement?.dataset.pick;
    offset = Math.min(offset, Math.max(0, Math.floor((rows.length - 1) / 50) * 50));
    find("[data-picker-count]").textContent = `전체 ${review.items.length}건 중 ${review.selected.size}건 선택 · 검색 결과 ${rows.length}건`;
    find("[data-picker-list]").innerHTML = rows.slice(offset, offset + 50).map((m) => `<div style="padding:9px 0;border-bottom:1px solid var(--line)">
      <label style="display:flex;gap:8px;align-items:baseline"><input type="checkbox" data-pick="${esc(m.key)}" ${review.selected.has(m.key) ? "checked" : ""} ${m.eligible ? "" : "disabled"} />
        <span style="overflow-wrap:anywhere">${esc(m.title || "(제목 없음)")}</span></label>
      <div class="meta">${esc((m.created_at || "").slice(0, 10))} · ${esc(m.status || ({web:"직접 작성",cli:"직접 작성",shared:"받은 메모",evernote:"에버노트",onenote:"OneNote",onenote_local:"PC의 OneNote",files:"파일",sticky:"스티커 메모",samsung:"삼성 노트",redmine:"Redmine",notion:"Notion"})[m.source] || "메모")}${m.tags?.length ? " · " + m.tags.map((t) => "#" + esc(t)).join(" ") : ""}</div>
      ${(m.warnings || []).map((w) => `<div class="note" style="color:var(--warn)">${esc(w)}</div>`).join("")}
      <details data-picker-detail="${esc(m.key)}" ${expanded.has(m.key) ? "open" : ""}><summary class="status">본문 확인</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:13px">${esc(m.body)}</pre></details>
      </div>`).join("") || '<div class="status">해당하는 메모가 없습니다.</div>';
    find("[data-picker-page]").textContent = rows.length ? `${offset + 1}–${Math.min(offset + 50, rows.length)} / ${rows.length}건` : "0건";
    find("[data-picker-prev]").disabled = offset === 0;
    find("[data-picker-next]").disabled = offset + 50 >= rows.length;
    target.querySelectorAll("[data-pick]").forEach((c) => {
      c.onchange = () => { c.checked ? review.selected.add(c.dataset.pick) : review.selected.delete(c.dataset.pick); draw(); changed(); };
      if (c.dataset.pick === focused) c.focus({ preventScroll: true });
    });
    list.scrollTop = scroll;
    target.querySelectorAll("[data-picker-detail]").forEach((d) => {
      d.ontoggle = () => { if (d.isConnected) d.open ? expanded.add(d.dataset.pickerDetail) : expanded.delete(d.dataset.pickerDetail); };
    });
  }
  find("[data-picker-search]").oninput = () => { offset = 0; draw(); };
  find("[data-picker-only]").onchange = () => { offset = 0; draw(); };
  find("[data-picker-all]").onclick = () => { matches().filter((m) => m.eligible).forEach((m) => review.selected.add(m.key)); draw(); changed(); };
  find("[data-picker-none]").onclick = () => { matches().forEach((m) => review.selected.delete(m.key)); draw(); changed(); };
  find("[data-picker-prev]").onclick = () => { offset -= 50; draw(); };
  find("[data-picker-next]").onclick = () => { offset += 50; draw(); };
  draw();
  changed();
}

function exportSignature(payload) {
  const { note, ...scope } = payload;
  return JSON.stringify(scope);
}
function invalidateExportReview() {
  exportPreviewVersion++;
  exportReview = null;
  paintExportReview();
  if ($("#expOut")) $("#expOut").textContent = "조건이 바뀌었습니다. 목록을 다시 확인하세요.";
}
function paintExportReview() {
  const el = $("#expReview");
  if (!el) return;
  if (!exportReview) {
    el.innerHTML = '<div class="note">먼저 목록을 확인하고 보낼 메모를 체크하세요. 한 번에 최대 1,000건.</div>';
    $("#expSave").textContent = "파일로 저장";
    $("#expCopy").textContent = "내용 복사";
    $("#expShare").textContent = "Teams로 파일 공유";
    return;
  }
  memoPicker(el, exportReview, () => {
    $("#expSave").textContent = `선택 ${exportReview.selected.size}건 파일로 저장`;
    $("#expCopy").textContent = `선택 ${exportReview.selected.size}건 복사`;
    $("#expShare").textContent = `선택 ${exportReview.selected.size}건 Teams로 파일 공유`;
  });
}
async function reviewedExportPayload() {
  const payload = exportPayload();
  if (!exportReview || exportReview.signature !== exportSignature(payload)) {
    await doExportPreview();
    toast("목록에서 보낼 메모를 확인한 뒤 내보내기 버튼을 다시 눌러주세요");
    return null;
  }
  if (!exportReview.selected.size) throw new Error("보낼 메모를 하나 이상 선택하세요.");
  const items = exportReview.items.filter((m) => exportReview.selected.has(m.key));
  return { ...payload, ids: items.map((m) => m.id), revisions: Object.fromEntries(items.map((m) => [m.id, m.revision])) };
}

// 입력칸에서 바로 읽는다 — 타이핑 직후 눌러도 방금 친 값이 반영돼야 한다.
function exportPayload() {
  if (!$("#expQ")) return {};
  exp.q = $("#expQ").value.trim();
  // 칩으로 고른 것 + 직접 적은 것. 둘 다 AND 로 겹친다.
  const typed = $("#expTag").value.split(",").map((t) => t.trim().replace(/^#/, "")).filter(Boolean);
  exp.tag = $("#expTag").value.trim();
  exp.since = $("#expSince").value.trim();
  exp.until = $("#expUntil").value.trim();
  exp.note = $("#expNote").value;
  exp.archived = $("#expArchived").checked;
  const all = [...new Set([...exp.tags, ...typed])];
  if (exp.since && exp.until && exp.since > exp.until) throw new Error("작성 시작일은 종료일보다 앞서야 합니다.");
  return { ...exp, tag: null, tags: all };
}

// 비밀번호를 확인한다. 비워두면 평문이 나간다는 걸 알고 고르게 한다 — 취소하면 null.
function exportPassword() {
  const pw = $("#expPw").value, pw2 = $("#expPw2").value;
  if (pw !== pw2) throw new Error("두 비밀번호가 다릅니다.");
  if (!pw && !confirm("비밀번호 없이 내보내면 파일을 손에 넣은 누구나 내용을 그대로 읽을 수 있습니다.\n암호화하지 않고 내보낼까요?")) return null;
  return pw;
}

function expBusy(msg) { $("#expOut").innerHTML = `<div class="status" style="margin-top:9px">${msg}</div>`; }
function expError(msg) {
  $("#expOut").innerHTML = `<div class="status" style="margin-top:9px;color:var(--danger)">${esc(msg)}</div>`;
}

async function doExportPreview() {
  const host = $("#expReview");
  const version = ++exportPreviewVersion;
  exportReview = null;
  paintExportReview();
  expBusy("고르는 중…");
  try {
    const payload = exportPayload(), signature = exportSignature(payload);
    const r = await api("/api/export/preview", { method: "POST", body: payload });
    if (version !== exportPreviewVersion || !host?.isConnected || signature !== exportSignature(exportPayload())) return;
    const items = r.items.map((m) => ({ ...m, key: String(m.id), eligible: true }));
    exportReview = { items, selected: new Set(items.map((m) => m.key)), signature };
    paintExportReview();
    $("#expOut").innerHTML = `<div class="note">${r.count}건을 찾았습니다. 체크된 메모만 내보냅니다.${payload.q ? " 의미 검색 결과이므로 관련 없는 메모는 체크를 해제하세요." : ""}<br>저장 위치: ${esc(r.default_dir)}</div>`;
  } catch (err) { if (version === exportPreviewVersion && host?.isConnected) expError(err.message); }
}

function exportLockNote(encrypted) {
  return encrypted
    ? "암호화된 파일입니다. 비밀번호는 파일과 <b>다른 경로</b>로 알려주세요."
    : `<span style="color:var(--warn)">암호화하지 않은 파일입니다 — 받는 사람 외에는 전달되지 않게 주의하세요.</span>`;
}

async function doExportSave() {
  try {
    const password = exportPassword();
    if (password === null) return;
    const payload = await reviewedExportPayload();
    if (!payload) return;
    expBusy(password ? "암호화해서 저장하는 중…" : "파일로 저장하는 중…");
    const r = await api("/api/export", { method: "POST", body: { ...payload, password } });
    $("#expOut").innerHTML = `<div style="margin-top:10px;padding:10px 12px;background:var(--panel-2);border-radius:8px">
      <div><b style="color:var(--accent-2)">메모 ${r.count}건을 내보냈습니다.</b></div>
      <div class="meta" style="margin-top:4px;word-break:break-all">${esc(r.path)} · ${(r.bytes / 1024).toFixed(1)}KB</div>
      <div class="note" style="margin-top:5px">이 파일을 그대로 전달하세요.
        받는 쪽은 <b>받은 메모 파일 넣기</b>에 경로를 넣고 가져오면 됩니다.<br>${exportLockNote(r.encrypted)}</div>
      <div class="row" style="margin-top:8px"><span class="spacer"></span>
        <button class="btn" id="expCopyPath">경로 복사</button></div>
    </div>`;
    $("#expCopyPath").onclick = () => { navigator.clipboard.writeText(r.path); toast("경로를 복사했습니다"); };
    toast(`${r.count}건을 파일로 내보냈습니다`);
  } catch (err) { expError(err.message); }
}

async function doExportCopy() {
  try {
    const password = exportPassword();
    if (password === null) return;
    const payload = await reviewedExportPayload();
    if (!payload) return;
    expBusy(password ? "암호화하는 중…" : "만드는 중…");
    const r = await api("/api/export/content", { method: "POST", body: { ...payload, password } });
    await navigator.clipboard.writeText(r.content);
    $("#expOut").innerHTML = `<div class="status" style="margin-top:9px">메모 ${r.count}건을 복사했습니다 —
      메신저에 붙여넣어 보내세요. 받는 쪽은 이 내용을 .json 파일로 저장하면 됩니다.<br>${exportLockNote(r.encrypted)}</div>`;
    toast(`${r.count}건을 복사했습니다`);
  } catch (err) { expError(err.message); }
}

async function shareToTeams(content) {
  const bridge = window.pywebview?.api;
  const mode = bridge?.share_to_teams ? await bridge.share_to_teams(content, null) : await openTeamsChatLink(content);
  if (mode === "filled") return "Teams 새 채팅에 본문을 넣었습니다. 받는 사람을 고르고 보내세요.";
  if (mode === "draft-copied") return "Teams에서 받는 사람과 본문을 확인하세요. 이전 초안이 보이면 복사된 본문을 붙여넣으세요.";
  if (mode === "paste") return "긴 본문 전체를 복사했습니다. Teams에서 받는 사람을 고르고 입력란에 붙여넣으세요.";
  return "Teams에서 받는 사람과 본문을 확인하세요. 본문이 다르면 ‘본문 복사’로 붙여넣으세요.";
}

function expShareHintText() {
  return window.pywebview?.api?.share_to_teams
    ? "Teams 새 채팅이 열리고 파일과 안내 글이 자동으로 들어갑니다. 받는 사람만 고르고 보내세요."
    : "Teams에서 받는 사람과 첨부파일을 확인한 뒤 전송하세요.";
}
// 데스크톱 앱의 연결(window.pywebview.api)은 화면이 뜬 뒤에 붙는다. 붙으면 안내를 데스크톱용으로 바꾼다.
window.addEventListener("pywebviewready", () => { if ($("#expShareHint")) $("#expShareHint").textContent = expShareHintText(); });

// 데스크톱 앱은 Teams 새 채팅을 열고 그 화면에 파일을 직접 붙인다(method "attached").
// 붙이지 못하면(method "manual") 새 채팅만 열려 있으니, 사용자가 '파일 첨부'로 올리거나 끌어다 놓는다.
function showPreparedAttachment(out, file) {
  let message;
  if (file.method === "attached") {
    message = "Teams 새 채팅에 파일과 안내 글을 넣었습니다. 받는 사람을 고르고 첨부를 확인한 뒤 보내세요.";
  } else if (file.method === "unconfirmed") {
    message = "Teams 파일 선택 창에 파일을 전달했습니다. 채팅에 아래 파일 이름이 표시되는지 먼저 확인하세요.";
  } else if (file.opened) {
    message = (file.reason || "Teams 새 채팅에 첨부를 확인하지 못했습니다.") + " 직접 첨부하려면 메시지 입력란에서 Alt+Shift+O를 누르고 "
      + "‘이 디바이스에서 업로드’를 선택하세요. ‘파일 위치 열기’에서 파일을 채팅으로 끌어다 놓을 수도 있습니다.";
  } else {
    message = "Teams 앱을 열 수 없습니다. Teams에 로그인한 뒤 파일 위치를 열고 준비된 파일을 Teams 채팅으로 끌어다 놓으세요.";
  }
  out.innerHTML = `<p>${esc(message)}</p><div class="row">
    <button type="button" class="btn" data-reveal-file>파일 위치 열기</button>
    <span class="meta">${esc(file.name)}</span></div><div data-reveal-error class="note"></div>`;
  out.querySelector("[data-reveal-file]").onclick = async () => {
    try { await window.pywebview.api.reveal_teams_file(file.name); }
    catch { out.querySelector("[data-reveal-error]").textContent = "탐색기에서 이 파일을 확인하세요. " + file.path; }
  };
}

function showBrowserAttachment(out, file, stillSelected) {
  out.innerHTML = `<p>첨부파일을 내려받고 Teams에서 받는 사람을 선택한 뒤, 파일을 채팅으로 끌어다 놓으세요.</p>
    <div class="row"><button class="btn" type="button" data-download-file>첨부파일 다운로드</button>
    <a class="btn" href="https://teams.microsoft.com/l/chat/0/0?users=" target="_blank" rel="noopener noreferrer">Teams 새 채팅 열기</a></div>`;
  out.querySelector("[data-download-file]").onclick = () => {
    if (!stillSelected()) { out.textContent = "선택이 바뀌었습니다. 다시 공유하세요."; return; }
    const link = document.createElement("a");
    link.href = URL.createObjectURL(file);
    link.download = file.name;
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 30000);
  };
}

// 메모(.json)·일정(.ics) 파일을 Teams로. result = {content, filename, text?}. text 는 파일과 함께 보낼 글.
async function shareExportFile(out, result, stillSelected) {
  const type = result.filename.endsWith(".ics") ? "text/calendar" : "application/json";
  const file = new File([result.content], result.filename, {type});
  if (file.size > 50000000) throw new Error("받는 쪽에서 열 수 있는 파일 크기는 50MB까지입니다. 메모를 나눠 선택하세요.");
  const bridge = window.pywebview?.api;
  if (bridge?.share_to_teams) {
    out.textContent = "Teams 새 채팅에 파일을 넣는 중… 몇 초 동안 마우스와 키보드를 쓰지 말고 기다려 주세요.";
    const prepared = await bridge.share_to_teams(result.content, result.filename, result.text || null);
    if (stillSelected()) showPreparedAttachment(out, prepared);
    return;
  }
  const data = {files: [file]};
  const windows = /^win/i.test(navigator.userAgentData?.platform || navigator.platform);
  if (windows || !navigator.canShare?.(data) || !navigator.share) {
    showBrowserAttachment(out, file, stillSelected);
    return;
  }
  const share = async () => {
    if (!stillSelected()) { out.textContent = "선택이 바뀌었습니다. 다시 공유하세요."; return; }
    out.textContent = "파일 공유 창을 여는 중…";
    try { await navigator.share(data); out.textContent = "공유 창에 내용을 전달했습니다."; }
    catch (err) {
      if (err.name === "AbortError") out.textContent = "공유를 취소했습니다.";
      else showBrowserAttachment(out, file, stillSelected);
    }
  };
  if (navigator.userActivation?.isActive === false) {
    out.innerHTML = '<button type="button" class="btn" data-open-share>준비된 파일 공유하기</button>';
    out.querySelector("button").onclick = share;
  } else { await share(); }
}

async function openTeamsChatLink(content) {
  const chat = "https://teams.microsoft.com/l/chat/0/0?users=";
  const draft = content.length <= 8000 ? chat + "&message=" + encodeURIComponent(content) : "";
  const prefilled = draft.length > 0 && draft.length <= 8000;
  const copying = navigator.clipboard?.writeText(content).then(() => true, () => false);
  if (!prefilled && !copying) throw new Error("긴 본문을 전달하려면 먼저 본문을 복사하세요.");
  const link = document.createElement("a");
  link.href = prefilled ? draft : chat;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.click();
  const copied = await copying;
  if (prefilled) return copied ? "draft-copied" : "draft";
  if (!copied) throw new Error("클립보드를 사용할 수 없습니다. 본문을 복사해 Teams에 붙여넣으세요.");
  return "paste";
}

async function doExportShare() {
  const button = $("#expShare"), out = $("#expOut");
  if (button.disabled) return;
  button.disabled = true;
  try {
    const payload = await reviewedExportPayload();
    if (!payload) return;
    const password = exportPassword();
    if (password === null) return;
    const review = exportReview;
    const stillSelected = () => button.isConnected && !out.closest("[hidden]") && review === exportReview &&
      review.signature === exportSignature(exportPayload()) && $("#expNote").value === payload.note &&
      $("#expPw").value === password && $("#expPw2").value === password &&
      review.selected.size === payload.ids.length && payload.ids.every(id => review.selected.has(String(id)));
    expBusy("선택한 메모를 첨부파일로 준비하는 중…");
    const result = await api("/api/export/content", { method: "POST", body: { ...payload, password } });
    if (!stillSelected()) throw new Error("공유할 메모나 옵션이 바뀌었습니다. 선택을 확인하고 다시 눌러주세요.");
    result.text = `memoinall 메모 ${result.count}건을 보냅니다. 받은 파일은 memoinall의 가져오기·공유 → 동료와 주고받기 → 찾아보기로 열 수 있습니다.`
      + (result.encrypted ? " 비밀번호는 따로 알려드릴게요." : "");
    await shareExportFile(out, result, stillSelected);
  } catch (err) { out.textContent = err.message; }
  finally { button.disabled = false; }
}

function redminePayload() {
  if (!$("#rmUrl")) return {};   // 가져오기 탭이 아닐 때
  return {
    url: $("#rmUrl").value.trim(),
    api_key: $("#rmKey").value.trim(),
    projects: $("#rmProjects").value.trim(),
    kinds: [...document.querySelectorAll("[data-kind]")].filter((c) => c.checked).map((c) => c.dataset.kind).join(","),
    limit: +$("#rmLimit").value || 300,
    since: $("#rmSince").value.trim(),
    include_notes: $("#rmNotes").checked,
  };
}

function notionPayload() {
  if (!$("#ntToken")) return {};   // 가져오기 탭이 아닐 때
  const limit = parseInt($("#ntLimit").value, 10);
  return {
    ...($("#ntToken").value.trim() ? { token: $("#ntToken").value.trim() } : {}),
    limit: Number.isInteger(limit) && limit > 0 ? Math.min(limit, 5000) : 300,
    since: $("#ntSince").value || "",
  };
}

async function previewNotebookFile(source, file) {
  if (!file) return;
  if (imp.busy) { toast("진행 중인 가져오기가 끝난 뒤 파일을 선택하세요"); return; }
  const slot = notebookFiles[source], version = ++slot.version;
  slot.content = slot.name = slot.error = "";
  delete importReviews[source];
  delete imp.results[source];
  document.querySelectorAll(`[data-src-run="${source}"], [data-src-preview="${source}"]`).forEach(b => { b.disabled = true; });
  $("#impOut-" + source).textContent = "";
  $("#" + source + "FileStatus").textContent = "파일을 읽는 중…";
  try {
    if (!file.size) throw new Error("빈 파일입니다. 내보낸 파일을 다시 선택하세요.");
    let content;
    if (source === "onenote") {
      if (!/\.(pdf|docx)$/i.test(file.name)) throw new Error("OneNote에서 PDF 또는 Word(.docx)로 내보낸 파일을 선택하세요.");
      if (file.size > 20000000) throw new Error("20MB 이하로 나눠 내보내세요.");
      content = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = () => reject(new Error("파일을 읽지 못했습니다. 다시 선택하세요."));
        reader.readAsDataURL(file);
      });
    } else {
      if (file.size > 50000000) throw new Error("50MB 이하의 ENEX 파일을 선택하세요. Evernote에서 나눠 내보낼 수 있습니다.");
      content = (await file.text()).replace(/^\uFEFF/, "");
    }
    if (version !== slot.version) return;
    slot.content = content;
    slot.name = file.name;
  } catch (err) {
    if (version !== slot.version) return;
    slot.error = err.message;
  }
  if (state.tab !== "import") return;
  await render();
  if (slot.content && version === slot.version && state.tab === "import") await doImport(true, source);
}

function importSignature(source) {
  return JSON.stringify([notebookFiles[source]?.version ?? [imp.sharedName, imp.sharedPath, imp.sharedPassword],
    imp.minChars, imp.update, imp.tags]);
}

async function doImport(dry, source = "all") {
  if (imp.busy) { toast("진행 중인 가져오기가 끝날 때까지 기다려주세요"); return; }
  const selectable = reviewSources.includes(source);
  const review = importReviews[source];
  if (!dry && selectable) {
    if (!review || review.signature !== importSignature(source)) {
      await doImport(true, source);
      toast("목록을 확인하고 필요한 메모를 체크한 뒤 가져오세요");
      return;
    }
    if (!review.selected.size) { toast("가져올 메모를 하나 이상 선택하세요"); return; }
  }
  const signature = importSignature(source);
  imp.busy = true;
  const buttons = [...document.querySelectorAll("[data-src-run], [data-src-preview], #impRunAll, #impPreviewAll, #sharedFile, #sharedQr, #evernoteFile, #onenoteFile, #impShared, #impSharedPw, #impMin, #impUpdate, #impTagRow button")];
  const disabledBefore = buttons.map((b) => b.disabled);
  buttons.forEach((b) => { b.disabled = true; });
  const targets = source === "all"
    ? (imp.section === "share" ? ["shared"] : ["sticky", "samsung", "onenote_local", "files", "redmine", "notion"])
    : [source];
  const completed = new Set();
  const busy = `<div class="status" style="margin-top:8px">${dry ? "확인" : "가져오기"} 중…</div>`;
  targets.forEach((n) => { const el = $(`#impOut-${n}`); if (el) el.innerHTML = busy; });

  const body = {
    source, path: imp.path || null, shared_path: imp.sharedPath || null, shared_content: imp.sharedContent || null,
    shared_password: imp.sharedPassword || null,
    ...(source === "evernote" ? { evernote_content: notebookFiles.evernote.content } : {}),
    ...(source === "onenote" ? { onenote_filename: notebookFiles.onenote.name, onenote_content: notebookFiles.onenote.content } : {}),
    review: selectable,
    ...(!dry && selectable ? { selected_keys: [...review.selected], revision: review.revision } : {}),
    min_chars: imp.minChars, update_existing: imp.update, tags: imp.tags,
    redmine: redminePayload(),
    notion: notionPayload(),
  };
  try {
    const r = { total: 0, total_updated: 0, total_corrected_times: 0 };
    for (const name of targets) {
      const part = await api(dry ? "/api/import/preview" : "/api/import/run", { method: "POST", body: { ...body, source: name } });
      part.results.forEach((x) => {
        const res = { ...x, dry_run: part.dry_run };
        if (selectable) {
          if (dry && !x.error && x.revision) {
            importReviews[x.source] = { items: x.items, selected: new Set(x.items.filter((m) => m.eligible).map((m) => m.key)), revision: x.revision, signature };
          } else delete importReviews[x.source];
        }
        imp.results[x.source] = res;
        paintResult(x.source, res);
        completed.add(x.source);
      });
      r.total += part.total;
      r.total_updated += part.total_updated;
      r.total_corrected_times += part.total_corrected_times || 0;
    }
    if (!dry) {
      const parts = [r.total ? `${r.total}건 가져옴` : "", r.total_updated ? `${r.total_updated}건 갱신` : "", r.total_corrected_times ? `${r.total_corrected_times}건 시간 바로잡음` : ""].filter(Boolean);
      toast(parts.length ? `${parts.join(" · ")} — 정리는 백그라운드에서 진행됩니다` : "새로 가져오거나 바뀐 메모가 없습니다");
      loadSidebar();
      loadTags();   // 붙인 태그의 건수가 바로 반영돼야 한다
    }
  } catch (err) {
    targets.forEach((n) => {
      if (completed.has(n)) return;
      const el = $(`#impOut-${n}`);
      if (el) el.innerHTML = `<div class="status" style="color:var(--danger);margin-top:8px">${esc(err.message)}</div>`;
    });
  } finally {
    imp.busy = false;
    buttons.forEach((b, i) => { if (b.isConnected) b.disabled = disabledBefore[i]; });
  }
}

function paintResult(name, x) {
  const el = $(`#impOut-${name}`);
  if (!el) return;
  const head = x.dry_run ? "미리보기" : "가져오기 완료";

  if (!x.available || x.error) {
    el.innerHTML = `<div class="status" style="margin-top:8px;color:${x.error && x.available ? "var(--danger)" : "var(--dim)"}">
      ${esc(x.error || "사용할 수 없습니다")}</div>`;
    return;
  }
  const skips = [
    x.skipped_existing ? `이미있음 ${x.skipped_existing}` : "",
    x.skipped_duplicate ? `같은 내용 ${x.skipped_duplicate}` : "",
    x.unchanged ? `변경없음 ${x.unchanged}` : "",
    x.skipped_empty ? `본문없음 ${x.skipped_empty}` : "",
    x.skipped_short ? `너무짧음 ${x.skipped_short}` : "",
  ].filter(Boolean).join(" · ");
  const updated = x.updated ? ` · <b style="color:var(--warn)">${x.updated}건 갱신</b>` : "";
  const corrected = x.corrected_times ? ` · ${x.corrected_times}건 시간 ${x.dry_run ? "바로잡기" : "바로잡음"}` : "";

  el.innerHTML = `<div style="margin-top:9px;padding:9px 11px;background:var(--panel-2);border-radius:8px">
    <div><span class="meta">${head}</span> — 원본 ${x.found}건 →
      <b style="color:var(--accent)">${x.importable}건</b>${updated}${corrected}
      ${x.dry_run ? '<span class="meta">(아직 저장 안 함)</span>' : '<span class="meta">저장됨</span>'}
      ${skips ? `<span class="meta">· ${skips}</span>` : ""}</div>
    ${x.median_chars ? `<div class="meta">본문 길이 중앙값 ${x.median_chars}자 · 최대 ${x.max_chars}자</div>` : ""}
    ${(x.warnings || []).map((w) => `<div class="note" style="color:var(--warn)">${esc(w)}</div>`).join("")}
    ${x.samples.length && !importReviews[name] ? `<div class="meta" style="margin-top:5px">${x.samples.map((s) => `· ${esc(s)}`).join("<br/>")}</div>` : ""}
    ${x.dry_run && importReviews[name] ? '<div data-import-picker></div>' : ""}
  </div>`;
  if (x.dry_run && importReviews[name]) memoPicker(el.querySelector("[data-import-picker]"), importReviews[name], () => {
    const button = document.querySelector(`[data-src-run="${name}"]`);
    if (button) button.textContent = `선택 ${importReviews[name].selected.size}건 가져오기`;
  });
}

function tagMsg(text, bad = false) {

async function refreshTags() {
  await Promise.all([render(), loadSidebar(), loadTags()]);
}

function paintTagList() {
  const box = $("#tagList");
  if (!box) return;
  if (!myTags.length) {
    box.innerHTML = `<div class="status">아직 정해 둔 태그가 없습니다. 아래에서 하나 만들어 보세요.</div>`;
    return;
  }
  box.innerHTML = myTags.map((t, i) => `
    <div class="row" style="gap:8px;padding:7px 0;border-bottom:1px solid var(--line)">
      <span class="tagchip t-${esc(t.color)} on" style="cursor:default">#${esc(t.name)}</span>
      <span class="meta">메모 ${t.count}건</span>
      <span class="spacer"></span>
      <button class="btn ghost" data-tup="${i}" ${i === 0 ? "disabled" : ""} title="위로">↑</button>
      <button class="btn ghost" data-tdown="${i}" ${i === myTags.length - 1 ? "disabled" : ""} title="아래로">↓</button>
      <select data-tcolor="${esc(t.name)}" title="색">
        ${TAG_COLORS.map((c) => `<option value="${c}"${c === t.color ? " selected" : ""}>${c}</option>`).join("")}
      </select>
      <button class="btn ghost" data-trename="${esc(t.name)}">이름 바꾸기</button>
      <button class="btn ghost" data-tdel="${esc(t.name)}" data-n="${t.count}" style="color:var(--danger)">삭제</button>
    </div>`).join("") + `<div id="tagAction"></div>`;

  box.querySelectorAll("[data-tup]").forEach((b) => { b.onclick = () => moveTag(+b.dataset.tup, -1); });
  box.querySelectorAll("[data-tdown]").forEach((b) => { b.onclick = () => moveTag(+b.dataset.tdown, 1); });
  box.querySelectorAll("[data-tcolor]").forEach((s) => {
    s.onchange = async () => {
      await api(`/api/tags/${encodeURIComponent(s.dataset.tcolor)}`,
                { method: "PUT", body: { color: s.value } });
      await refreshTags();
    };
  });
  box.querySelectorAll("[data-trename]").forEach((b) => { b.onclick = () => askRename(b.dataset.trename); });
  box.querySelectorAll("[data-tdel]").forEach((b) => { b.onclick = () => askDeleteTag(b.dataset.tdel, +b.dataset.n); });
}

async function moveTag(index, delta) {
  const order = myTags.map((t) => t.name);
  const to = index + delta;
  if (to < 0 || to >= order.length) return;
  [order[index], order[to]] = [order[to], order[index]];
  await api("/api/tags/order", { method: "POST", body: { order } });
  await refreshTags();
}

function askRename(name) {
  const box = $("#tagAction");
  // 이름을 바꾸면 메모 본문까지 바뀐다. 무슨 일이 벌어지는지 먼저 말해야 한다.
  box.innerHTML = `<div style="margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px">
      <div><b>#${esc(name)}</b> 의 이름을 바꿉니다.</div>
      <div class="note" style="margin-top:4px">이 태그가 달린 <b>메모 본문의 <code>#${esc(name)}</code> 도 함께 바뀝니다.</b>
        <code>#${esc(name)}팀</code> 처럼 이어 붙은 다른 태그는 건드리지 않습니다.</div>
      <div class="row" style="margin-top:9px;gap:8px">
        <input id="renameTo" value="${esc(name)}" style="flex:1" />
        <button class="btn" data-cancel>취소</button>
        <button class="btn primary" data-go>바꾸기</button>
      </div>
      <div class="note" id="renameMsg"></div>
    </div>`;
  box.querySelector("[data-cancel]").onclick = () => { box.innerHTML = ""; };
  box.querySelector("[data-go]").onclick = async () => {
    const to = $("#renameTo").value.trim();
    if (!to || to === name) { box.innerHTML = ""; return; }
    try {
      const r = await api(`/api/tags/${encodeURIComponent(name)}`, { method: "PUT", body: { name: to } });
      toast(`#${name} → #${r.name} · 메모 ${r.memos_changed || 0}건도 고쳤습니다`);
      await refreshTags();
    } catch (err) {
      $("#renameMsg").innerHTML = `<span style="color:var(--danger)">${esc(err.message)}</span>`;
    }
  };
  $("#renameTo").focus();
}

function askDeleteTag(name, count) {
  const box = $("#tagAction");
  box.innerHTML = `<div style="margin-top:10px;padding:10px 12px;border:1px solid var(--danger);border-radius:8px">
      <div><b style="color:var(--danger)">#${esc(name)}</b> 을 목록에서 뺍니다.</div>
      <div class="note" style="margin-top:4px">기본은 <b>목록에서만</b> 빠집니다 — 메모 ${count}건에 적힌
        <code>#${esc(name)}</code> 는 그대로 남고 조회도 됩니다.</div>
      <label style="display:block;margin-top:8px;color:var(--dim);font-size:13.5px;cursor:pointer">
        <input type="checkbox" id="purgeTag" style="margin-right:6px"/>메모 본문에서도 지우기
        <b style="color:var(--danger)">(메모 ${count}건이 수정됩니다 · 되돌릴 수 없음)</b></label>
      <div class="row" style="margin-top:9px">
        <span class="spacer"></span>
        <button class="btn" data-cancel>취소</button>
        <button class="btn primary" data-go style="background:var(--danger);border-color:var(--danger)">빼기</button>
      </div>
    </div>`;
  box.querySelector("[data-cancel]").onclick = () => { box.innerHTML = ""; };
  box.querySelector("[data-go]").onclick = async () => {
    const purge = $("#purgeTag").checked;
    const r = await api(`/api/tags/${encodeURIComponent(name)}?purge=${purge}`, { method: "DELETE" });
    toast(purge ? `#${name} 을 메모 ${r.memos_changed}건에서 지웠습니다` : `#${name} 을 목록에서 뺐습니다`);
    state.tags = state.tags.filter((t) => t !== name);
    await refreshTags();
  };
}

// ---------------------------------------------------------------- 상세
const explicitTagLine = /^\s*(?:태그|tags?)\s*:/i;
function detailTagReference() {
  return state.memo?.tag_reference_pattern ? new RegExp(state.memo.tag_reference_pattern, "i") : null;
}
function detailTagNames() {
  const body = $("#dBody").value, reference = detailTagReference();
  if (!reference) return bodyTags(body);
  return body.split("\n").flatMap(line => bodyTags(line).filter(name => !reference.test(name) || explicitTagLine.test(line)));
}
function paintDetailTags() {
  const names = [...new Set(detailTagNames())];
  const choices = [...new Map([...myTags, ...tagSuggestions].map((t) => [t.name, t])).values()];
  $("#dTags").innerHTML = names.length ? names.map((name) => {
    const tag = myTags.find((t) => t.name === name);
    return `<button type="button" class="tagchip on t-${esc(tag?.color || "slate")}" data-detail-remove="${esc(name)}"
      aria-label="#${esc(name)} 태그 제거" title="이 메모에서 태그 제거">#${esc(name)} <span aria-hidden="true">×</span></button>`;
  }).join("") : `<span class="hint">태그가 없습니다. 아래에서 추가하세요.</span>`;
  $("#dTags").querySelectorAll("[data-detail-remove]").forEach((button) => {
    button.onclick = () => {
      const name = button.dataset.detailRemove;
      const pattern = new RegExp(`(^|\\s)#${name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(?![${TAG_CHARS}])`, "g");
      const input = $("#dBody");
      if (detailTagReference()?.test(name)) {
        input.value = input.value.split("\n").flatMap(line => {
          if (!explicitTagLine.test(line)) return [line];
          const updated = line.replace(pattern, "$1");
          return updated !== line && !updated.replace(explicitTagLine, "").trim() ? [] : [updated];
        }).join("\n");
      } else {
        input.value = input.value.replace(pattern, "$1");
      }
      setEditing(true);
      $("#dTagMessage").textContent = `#${name} 제거됨 · 저장하면 반영됩니다`;
      paintDetailTags();
    };
  });
  // 읽기 화면에서 태그를 바꿔도 저장 버튼이 보여야 한다
  if (state.memo && $("#dBody").value !== state.memo.body) setEditing(true);
  $("#dTagPicker").hidden = !choices.length;
  $("#dTagChoices").innerHTML = choices.map((tag) => {
    const selected = names.some((name) => name.toLowerCase() === tag.name.toLowerCase());
    return tagChip(tag, selected, `data-detail-add="${esc(tag.name)}" ${selected ? "disabled" : ""}`);
  }).join("");
  $("#dTagChoices").querySelectorAll("[data-detail-add]").forEach((button) => {
    button.onclick = () => addDetailTag(button.dataset.detailAdd);
  });
}

function addDetailTag(raw = $("#dTagInput").value) {
  const name = String(raw).trim().replace(/^#+/, "").trim().replace(/\s+/g, "_");
  if (!new RegExp(`^[${TAG_CHARS}]{1,40}$`).test(name)) {
    $("#dTagMessage").textContent = "태그는 1~40자의 한글·영문·숫자·_·-·/로 입력하세요. 공백은 _로 바뀝니다.";
    $("#dTagInput").focus();
    return false;
  }
  const exists = detailTagNames().some((tag) => tag.toLowerCase() === name.toLowerCase());
  if (!exists) {
    const body = $("#dBody").value;
    $("#dBody").value = detailTagReference()?.test(name)
      ? body + "\n태그: #" + name
      : body + (body && !/\s$/.test(body) ? "\n" : "") + "#" + name;
    setEditing(true);
  }
  if (raw === $("#dTagInput").value) $("#dTagInput").value = "";
  $("#dTagMessage").textContent = exists ? `#${name} 태그가 이미 있습니다.` : `#${name} 추가됨 · 저장하면 반영됩니다`;
  paintDetailTags();
  return true;
}

function detailDirty() {
  return $("#detail").open && state.memo && ($("#dBody").value !== state.memo.body.replace(/\r\n?/g, "\n") || $("#dTagInput").value.trim());
}
function closeDetail() {
  if (detailDirty() && !confirm("수정한 내용이 아직 저장되지 않았습니다. 변경 내용을 버리고 닫을까요?")) return false;
  $("#detail").close();
  return true;
}
// 검색 결과에서 열면 '왜 걸렸는지'를 본문 안에서 바로 보여준다.
// 두 가지를 표시한다 — 검색어와 글자가 같은 곳(mark), 그리고 뜻으로 걸린
// 대목(passage). 후자가 필요한 이유는 의미 검색이라 글자가 하나도 안 겹쳐도
// 걸릴 수 있기 때문이다. 그때 표시가 하나도 없으면 "왜 이게 나왔지" 가 된다.

function queryTerms(query) {
  return [...new Set(String(query || "").split(/\s+/)
    .map((t) => t.replace(/^[#@]/, "").trim())
    .filter((t) => t.length >= 2))].slice(0, 8);
}

const reEsc = (s) => String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

// 원문에서 위치를 찾고 조각마다 이스케이프한다. 이스케이프한 HTML 위에서
// 매칭하면 '&amp;' 같은 실체 참조 안쪽이 걸려 표시가 깨질 수 있다.
function markTerms(text, terms) {
  text = String(text ?? "");
  if (!terms.length) return esc(text);
  const re = new RegExp("(" + terms.map(reEsc).join("|") + ")", "gi");
  let out = "", last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index === re.lastIndex) { re.lastIndex++; continue; }  // 빈 매치 방어
    out += esc(text.slice(last, m.index)) + "<mark>" + esc(m[0]) + "</mark>";
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}

// 뜻으로 걸린 대목이 본문 어디인지 찾는다.
// 그냥 indexOf 로는 거의 못 찾는다 — 청크는 문단을 줄바꿈 하나로 이어 붙여
// 저장돼서, 글자는 같아도 빈 줄이 접혀 있기 때문이다. 공백만 느슨하게 본다.
function findPassage(body, chunk) {
  if (!chunk || chunk.length < 20) return null;
  const at = body.indexOf(chunk);
  if (at >= 0) return [at, at + chunk.length];
  const pattern = chunk.trim().split(/\s+/).map(reEsc).join("\\s+");
  let m = null;
  try { m = body.match(new RegExp(pattern)); } catch { return null; }
  return m ? [m.index, m.index + m[0].length] : null;
}

function docHTML(body, query, chunk) {
  const terms = queryTerms(query);
  const span = findPassage(body, chunk);
  // 못 찾으면 조용히 건너뛴다 — 엉뚱한 데를 칠하느니 안 칠하는 게 낫다.
  if (!span) return markTerms(body, terms);
  const [from, to] = span;
  return markTerms(body.slice(0, from), terms)
    + `<span class="passage">${markTerms(body.slice(from, to), terms)}</span>`
    + markTerms(body.slice(to), terms);
}

let hitIndex = 0;

// 표시할 곳이 있으면 읽기 화면으로, 없으면 지금처럼 바로 고치는 화면으로 연다.
function paintDoc(m, hit) {
  const view = $("#dView");
  const query = hit ? hit.q : "";
  view.innerHTML = hit ? docHTML(m.body, query, hit.chunk) : "";
  const marks = [...view.querySelectorAll("mark")];
  const passage = view.querySelector(".passage");
  const bar = $("#dHits");

  if (!marks.length && !passage) { setEditing(true, false); return; }
  setEditing(false);
  bar.hidden = false;
  bar.innerHTML = marks.length
    ? `<button class="btn" id="hPrev" aria-label="이전 표시">‹</button>
       <span class="meta" id="hAt"></span>
       <button class="btn" id="hNext" aria-label="다음 표시">›</button>
       <span class="meta">검색어 '${esc(query)}' — 글자가 같은 곳</span>
       ${passage ? `<span class="badge why">뜻으로 걸린 대목도 표시했습니다</span>` : ""}`
    : `<span class="meta">검색어와 <b>글자가 같은 곳은 없습니다</b> —
         뜻이 비슷해서 걸렸습니다. 아래 표시한 대목이 그 이유입니다.</span>`;

  if (!marks.length) { scrollToHit(passage); return; }
  hitIndex = 0;
  const show = () => {
    marks.forEach((el, i) => el.classList.toggle("on", i === hitIndex));
    $("#hAt").textContent = `${hitIndex + 1} / ${marks.length}`;
    scrollToHit(marks[hitIndex]);
  };
  $("#hPrev").onclick = () => { hitIndex = (hitIndex - 1 + marks.length) % marks.length; show(); };
  $("#hNext").onclick = () => { hitIndex = (hitIndex + 1) % marks.length; show(); };
  show();
}

function scrollToHit(el) {
  if (!el) return;
  // 스크롤 대상은 본문 상자다. dialog 안이라 scrollIntoView 는 창까지 움직인다.
  const box = $(".dlg-b");
  box.scrollTop = Math.max(0, el.offsetTop - box.clientHeight / 3);
}

function setEditing(on, focus = false) {
  $("#dBody").hidden = !on;
  $("#dView").hidden = on;
  $("#dSave").hidden = !on;
  $("#dEdit").hidden = on;
  if (on) $("#dHits").hidden = true;
  if (on && focus) $("#dBody").focus();
}

let memoRequest = 0;
let memoRefresh = 0, detailHit = null;
async function openMemo(id, hit = null, refreshOnly = false) {
  if (detailDirty() && !confirm("현재 수정한 내용을 버리고 다른 메모를 열까요?")) return;
  const request = refreshOnly ? memoRequest : ++memoRequest;
  const refresh = ++memoRefresh;
  let m;
  try { m = await api(`/api/memos/${id}`); }
  catch (e) { toast("메모를 열지 못했습니다: " + e.message); return; }
  if (request !== memoRequest) return;
  if (refreshOnly && (refresh !== memoRefresh || !$("#detail").open || state.memo?.id !== id || detailDirty())) return;
  if (!refreshOnly) detailHit = hit;
  const displayHit = refreshOnly && !$("#dBody").hidden ? null : detailHit;
  const caret = refreshOnly && document.activeElement === $("#dBody")
    ? [$("#dBody").selectionStart, $("#dBody").selectionEnd] : null;
  state.memo = m;
  $("#dShareFeedback").hidden = true;
  $("#dShare").disabled = false;
  $("#dTitle").textContent = m.title;
  $("#dMeta").textContent = `작성 ${fmt(m.created_at)}` +
    (m.updated_at && m.updated_at !== m.created_at ? ` · 수정 ${fmt(m.updated_at)}` : "");
  $("#dBody").value = m.body;
  paintPin();
  paintLinks();
  paintMemoWindowButton();
  $("#dTagInput").value = "";
  $("#dTagMessage").textContent = "";
  $("#dTagPicker").open = false;
  paintDetailTags();
  const f = m.facets || {};
  $("#dBadges").innerHTML = [
    ...(f.person || []).map((p) => `<span class="badge person">@${esc(p)}</span>`),
    ...(f.date || []).map((d) => `<span class="badge">${esc(d)}</span>`),
    ...(f.decision || []).map((d) => `<span class="badge">결정: ${esc(d.slice(0, 40))}</span>`),
  ].join("");
  $("#dSimilar").innerHTML = m.similar?.length
    ? `<div class="side-h">비슷한 메모</div><ul style="padding:0">${m.similar.map((s) => `<li data-memo="${s.id}" style="list-style:none;color:var(--dim);cursor:pointer;padding:2px 0">· ${esc(s.title)} <span class="meta">${fmt(s.created_at)}</span></li>`).join("")}</ul>`
    : "";
  $("#dSimilar").querySelectorAll("[data-memo]").forEach((li) => (li.onclick = () => openMemo(+li.dataset.memo)));
  // 엑셀 취합의 대표 메모는 표 자체로 이어진다. 메모 본문은 요약일 뿐이다.
  const collection = m.source === "collection" && /^collection:(\d+)$/.exec(m.external_id || "");
  $("#dCollection").hidden = !collection;
  $("#dCollection").dataset.id = collection ? collection[1] : "";
  $("#dPack").textContent = collection ? "이 자료로 문서 만들기" : "이 메모로 문서 만들기";
  if (!$("#detail").open) $("#detail").showModal();
  // 창이 열린 뒤라야 위치를 잴 수 있다 — 닫혀 있으면 높이가 전부 0 이라 안 움직인다.
  paintDoc(m, displayHit);
  if (caret) $("#dBody").setSelectionRange(...caret);
}

async function paintMemoWindowButton() {

  if (button.hidden || !state.memo) return;

  try {
    const s = await api("/api/memo-windows");

      : "작은 창에서 메모를 편집하고 Ctrl+S로 저장합니다. 앱을 다시 켜면 자동으로 다시 뜹니다.";

$("#dTagAdd").onclick = () => { if (addDetailTag()) $("#dTagInput").focus(); };
$("#dTagInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); addDetailTag(); }
});
$("#detail").addEventListener("cancel", (e) => { e.preventDefault(); closeDetail(); });
$("#dSave").onclick = async () => {
  if ($("#dSave").disabled) return;
  if ($("#dTagInput").value.trim() && !addDetailTag()) return;
  const id = state.memo.id, body = $("#dBody").value, expected = state.memo.body;
  $("#dSave").disabled = $("#dDelete").disabled = $("#dPack").disabled = true;
  try {
    let memo, copied = false;
    try {
      memo = await api(`/api/memos/${id}`, { method: "PUT", body: { body, expected_body: expected } });
    } catch (error) {
      if (error.status !== 409 && error.status !== 404) throw error;
      if (state.memo?.id !== id || !$("#detail").open ||
          !confirm(error.message + " 지금 편집한 내용을 새 메모로 저장할까요?")) return;
      memo = await api("/api/memos", {method: "POST", body: {body}});
      copied = true;
    }
    if (state.memo.id === id) {
      state.memo = memo;
      if ($("#dBody").value === body && !$("#dTagInput").value.trim()) $("#detail").close();
    }
    toast(copied ? "편집한 내용을 새 메모로 저장했습니다" : "수정했습니다");
    render(); loadSidebar(); loadTags();
  } catch (e) { toast("수정 실패: " + e.message); }
  finally { $("#dSave").disabled = $("#dDelete").disabled = $("#dPack").disabled = false; }
};
// 지우면 휴지통으로 간다. 바로 되돌릴 수 있고, 30일 동안은 휴지통에서도 되살릴 수 있어 확인 창을 묻지 않는다.
