function paintDetailTags() {
  const names = [...new Set(bodyTags($("#dBody").value))];
  const choices = [...new Map([...myTags, ...tagSuggestions].map((t) => [t.name, t])).values()];
  $("#dTags").innerHTML = names.length ? names.map((name) => {
    const tag = myTags.find((t) => t.name === name);
    return `<button type="button" class="tagchip on t-${esc(tag?.color || "slate")}" data-detail-remove="${esc(name)}"
      aria-label="#${esc(name)} 태그 제거" title="이 메모에서 태그 제거">#${esc(name)} <span aria-hidden="true">×</span></button>`;
  }).join("") : `<span class="hint">태그가 없습니다. 아래에서 추가하세요.</span>`;
  $("#dTags").querySelectorAll("[data-detail-remove]").forEach((button) => {
    button.onclick = () => {
      const name = button.dataset.detailRemove;
      const pattern = new RegExp(`(^|\\s)#${name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(?![${TAG_CHARS}])`, "g");
      $("#dBody").value = $("#dBody").value.replace(pattern, "$1");
      setEditing(true);
      $("#dTagMessage").textContent = `#${name} 제거됨 · 저장하면 반영됩니다`;
      paintDetailTags();
    };
  });
  // 읽기 화면에서 태그를 바꿔도 저장 버튼이 보여야 한다
  if (state.memo && $("#dBody").value !== state.memo.body) setEditing(true);
  $("#dTagPicker").hidden = !choices.length;
  $("#dTagChoices").innerHTML = choices.map((tag) => {
    const selected = names.some((name) => name.toLowerCase() === tag.name.toLowerCase());
    return tagChip(tag, selected, `data-detail-add="${esc(tag.name)}" ${selected ? "disabled" : ""}`);
  }).join("");
  $("#dTagChoices").querySelectorAll("[data-detail-add]").forEach((button) => {
    button.onclick = () => addDetailTag(button.dataset.detailAdd);
  });
}

function addDetailTag(raw = $("#dTagInput").value) {
  const name = String(raw).trim().replace(/^#+/, "").trim().replace(/\s+/g, "_");
  if (!new RegExp(`^[${TAG_CHARS}]{1,40}$`).test(name)) {
    $("#dTagMessage").textContent = "태그는 1~40자의 한글·영문·숫자·_·-·/로 입력하세요. 공백은 _로 바뀝니다.";
    $("#dTagInput").focus();
    return false;
  }
  const exists = bodyTags($("#dBody").value).some((tag) => tag.toLowerCase() === name.toLowerCase());
  if (!exists) {
    const body = $("#dBody").value;
    $("#dBody").value = body + (body && !/\s$/.test(body) ? "\n" : "") + "#" + name;
    setEditing(true);
  }
  if (raw === $("#dTagInput").value) $("#dTagInput").value = "";
  $("#dTagMessage").textContent = exists ? `#${name} 태그가 이미 있습니다.` : `#${name} 추가됨 · 저장하면 반영됩니다`;
  paintDetailTags();
  return true;
}

function detailDirty() {
  return $("#detail").open && state.memo && ($("#dBody").value !== state.memo.body || $("#dTagInput").value.trim());
}
function closeDetail() {
  if (detailDirty() && !confirm("수정한 내용이 아직 저장되지 않았습니다. 변경 내용을 버리고 닫을까요?")) return false;
  $("#detail").close();
  return true;
}
// 검색 결과에서 열면 '왜 걸렸는지'를 본문 안에서 바로 보여준다.
// 두 가지를 표시한다 — 검색어와 글자가 같은 곳(mark), 그리고 뜻으로 걸린
// 대목(passage). 후자가 필요한 이유는 의미 검색이라 글자가 하나도 안 겹쳐도
// 걸릴 수 있기 때문이다. 그때 표시가 하나도 없으면 "왜 이게 나왔지" 가 된다.

function queryTerms(query) {
  return [...new Set(String(query || "").split(/\s+/)
    .map((t) => t.replace(/^[#@]/, "").trim())
    .filter((t) => t.length >= 2))].slice(0, 8);
}

const reEsc = (s) => String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

// 원문에서 위치를 찾고 조각마다 이스케이프한다. 이스케이프한 HTML 위에서
// 매칭하면 '&amp;' 같은 실체 참조 안쪽이 걸려 표시가 깨질 수 있다.
function markTerms(text, terms) {
  text = String(text ?? "");
  if (!terms.length) return esc(text);
  const re = new RegExp("(" + terms.map(reEsc).join("|") + ")", "gi");
  let out = "", last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index === re.lastIndex) { re.lastIndex++; continue; }  // 빈 매치 방어
    out += esc(text.slice(last, m.index)) + "<mark>" + esc(m[0]) + "</mark>";
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}

// 뜻으로 걸린 대목이 본문 어디인지 찾는다.
// 그냥 indexOf 로는 거의 못 찾는다 — 청크는 문단을 줄바꿈 하나로 이어 붙여
// 저장돼서, 글자는 같아도 빈 줄이 접혀 있기 때문이다. 공백만 느슨하게 본다.
function findPassage(body, chunk) {
  if (!chunk || chunk.length < 20) return null;
  const at = body.indexOf(chunk);
  if (at >= 0) return [at, at + chunk.length];
  const pattern = chunk.trim().split(/\s+/).map(reEsc).join("\\s+");
  let m = null;
  try { m = body.match(new RegExp(pattern)); } catch { return null; }
  return m ? [m.index, m.index + m[0].length] : null;
}

function docHTML(body, query, chunk) {
  const terms = queryTerms(query);
  const span = findPassage(body, chunk);
  // 못 찾으면 조용히 건너뛴다 — 엉뚱한 데를 칠하느니 안 칠하는 게 낫다.
  if (!span) return markTerms(body, terms);
  const [from, to] = span;
  return markTerms(body.slice(0, from), terms)
    + `<span class="passage">${markTerms(body.slice(from, to), terms)}</span>`
    + markTerms(body.slice(to), terms);
}

let hitIndex = 0;

// 표시할 곳이 있으면 읽기 화면으로, 없으면 지금처럼 바로 고치는 화면으로 연다.
function paintDoc(m, hit) {
  const view = $("#dView");
  const query = hit ? hit.q : "";
  view.innerHTML = hit ? docHTML(m.body, query, hit.chunk) : "";
  const marks = [...view.querySelectorAll("mark")];
  const passage = view.querySelector(".passage");
  const bar = $("#dHits");

  if (!marks.length && !passage) { setEditing(true, false); return; }
  setEditing(false);
  bar.hidden = false;
  bar.innerHTML = marks.length
    ? `<button class="btn" id="hPrev" aria-label="이전 표시">‹</button>
       <span class="meta" id="hAt"></span>
       <button class="btn" id="hNext" aria-label="다음 표시">›</button>
       <span class="meta">검색어 '${esc(query)}' — 글자가 같은 곳</span>
       ${passage ? `<span class="badge why">뜻으로 걸린 대목도 표시했습니다</span>` : ""}`
    : `<span class="meta">검색어와 <b>글자가 같은 곳은 없습니다</b> —
         뜻이 비슷해서 걸렸습니다. 아래 표시한 대목이 그 이유입니다.</span>`;

  if (!marks.length) { scrollToHit(passage); return; }
  hitIndex = 0;
  const show = () => {
    marks.forEach((el, i) => el.classList.toggle("on", i === hitIndex));
    $("#hAt").textContent = `${hitIndex + 1} / ${marks.length}`;
    scrollToHit(marks[hitIndex]);
  };
  $("#hPrev").onclick = () => { hitIndex = (hitIndex - 1 + marks.length) % marks.length; show(); };
  $("#hNext").onclick = () => { hitIndex = (hitIndex + 1) % marks.length; show(); };
  show();
}

function scrollToHit(el) {
  if (!el) return;
  // 스크롤 대상은 본문 상자다. dialog 안이라 scrollIntoView 는 창까지 움직인다.
  const box = $(".dlg-b");
  box.scrollTop = Math.max(0, el.offsetTop - box.clientHeight / 3);
}

function setEditing(on, focus = false) {
  $("#dBody").hidden = !on;
  $("#dView").hidden = on;
  $("#dSave").hidden = !on;
  $("#dEdit").hidden = on;
  if (on) $("#dHits").hidden = true;
  if (on && focus) $("#dBody").focus();
}

let memoRequest = 0;
async function openMemo(id, hit = null) {
  if (detailDirty() && !confirm("현재 수정한 내용을 버리고 다른 메모를 열까요?")) return;
  const request = ++memoRequest;
  let m;
  try { m = await api(`/api/memos/${id}`); }
  catch (e) { toast("메모를 열지 못했습니다: " + e.message); return; }
  if (request !== memoRequest) return;
  state.memo = m;
  $("#dTitle").textContent = m.title;
  $("#dMeta").textContent = `작성 ${fmt(m.created_at)}` +
    (m.updated_at && m.updated_at !== m.created_at ? ` · 수정 ${fmt(m.updated_at)}` : "");
  $("#dBody").value = m.body;
  $("#dTagInput").value = "";
  $("#dTagMessage").textContent = "";
  $("#dTagPicker").open = false;
  paintDetailTags();
  const f = m.facets || {};
  $("#dBadges").innerHTML = [
    ...(f.person || []).map((p) => `<span class="badge person">@${esc(p)}</span>`),
    ...(f.date || []).map((d) => `<span class="badge">${esc(d)}</span>`),
    ...(f.decision || []).map((d) => `<span class="badge">결정: ${esc(d.slice(0, 40))}</span>`),
  ].join("");
  $("#dSimilar").innerHTML = m.similar?.length
    ? `<div class="side-h">비슷한 메모</div><ul style="padding:0">${m.similar.map((s) => `<li data-memo="${s.id}" style="list-style:none;color:var(--dim);cursor:pointer;padding:2px 0">· ${esc(s.title)} <span class="meta">${fmt(s.created_at)}</span></li>`).join("")}</ul>`
    : "";
  $("#dSimilar").querySelectorAll("[data-memo]").forEach((li) => (li.onclick = () => openMemo(+li.dataset.memo)));
  // 엑셀 취합의 대표 메모는 표 자체로 이어진다. 메모 본문은 요약일 뿐이다.
  const collection = m.source === "collection" && /^collection:(\d+)$/.exec(m.external_id || "");
  $("#dCollection").hidden = !collection;
  $("#dCollection").dataset.id = collection ? collection[1] : "";
  $("#dPack").textContent = collection ? "이 자료를 AI로 정리" : "이 메모로 문서 만들기";
  if (!$("#detail").open) $("#detail").showModal();
  // 창이 열린 뒤라야 위치를 잴 수 있다 — 닫혀 있으면 높이가 전부 0 이라 안 움직인다.
  paintDoc(m, hit);
}

$("#dClose").onclick = closeDetail;
$("#dEdit").onclick = () => setEditing(true, true);
$("#dBody").addEventListener("input", paintDetailTags);
$("#dTagAdd").onclick = () => { if (addDetailTag()) $("#dTagInput").focus(); };
$("#dTagInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); addDetailTag(); }
});
$("#detail").addEventListener("cancel", (e) => { e.preventDefault(); closeDetail(); });
$("#dSave").onclick = async () => {
  if ($("#dSave").disabled) return;
  if ($("#dTagInput").value.trim() && !addDetailTag()) return;
  const id = state.memo.id, body = $("#dBody").value;
  $("#dSave").disabled = $("#dDelete").disabled = $("#dPack").disabled = true;
  try {
    const memo = await api(`/api/memos/${id}`, { method: "PUT", body: { body } });
    if (state.memo.id === id) {
      state.memo = memo;
      if ($("#dBody").value === body && !$("#dTagInput").value.trim()) $("#detail").close();
    }
    toast("수정했습니다");
    render(); loadSidebar(); loadTags();
  } catch (e) { toast("수정 실패: " + e.message); }
  finally { $("#dSave").disabled = $("#dDelete").disabled = $("#dPack").disabled = false; }
};
$("#dDelete").onclick = async () => {
  if (!confirm("이 메모를 삭제할까요?")) return;
  try {
    await api(`/api/memos/${state.memo.id}`, { method: "DELETE" });
    state.selected.delete(state.memo.id);
    $("#detail").close();
    toast("삭제했습니다");
    render(); loadSidebar(); loadTags();
  } catch (e) { toast("삭제 실패: " + e.message); }
};
$("#dPack").onclick = () => {
  if (gen.busy) { toast("진행 중인 생성이 끝난 뒤 다시 시도하세요"); return; }
  const m = state.memo, collection = $("#dCollection").dataset.id;
  if (!closeDetail()) return;
  if (collection) colStartAi(+collection);
  else startGenerate([m.id], `"${m.title}" 내용을 정리해줘`);
};
$("#dCollection").onclick = () => {
  const id = +$("#dCollection").dataset.id;
  if (id && closeDetail()) colOpen(id);
};

document.addEventListener("keydown", (e) => {
  if (e.key === "/" && !$("#detail").open && !["TEXTAREA", "INPUT", "SELECT"].includes(document.activeElement.tagName)) {
    e.preventDefault();
    goTab("feed"); $("#q").focus();
  }
});
window.addEventListener("beforeunload", (e) => {
  localDraft($("#capture").value);
  if (genDirty() || gen.busy || detailDirty() || docImport.dirty || docImport.saving || $("#capture").value !== draftSaved || captureSaving
      || col.upload || col.preview) {
    e.preventDefault(); e.returnValue = "";
  }
});

renderTabs();
loadSidebar().catch((e) => toast("상태를 불러오지 못했습니다: " + e.message));
loadTags();
render();
restoreDraft();
setInterval(() => loadSidebar().catch(() => {}), 6000);
</script>
</body>
</html>
