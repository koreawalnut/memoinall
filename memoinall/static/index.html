<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>memoinall</title>
<style>
  :root {
    --bg: #0f1115; --panel: #161a21; --panel-2: #1c212a; --line: #262c37;
    --fg: #e6e9ef; --dim: #8b95a7; --accent: #7aa2f7; --accent-2: #9ece6a;
    --warn: #e0af68; --danger: #f7768e; --radius: 10px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f5; --line: #e0e3e9;
      --fg: #1a1d23; --dim: #6b7280; --accent: #3b6fd4; --accent-2: #3f8f45;
      --warn: #a36b16; --danger: #c0384f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15.5px/1.65 "Pretendard", -apple-system, "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  @media (max-width: 860px) { .app { grid-template-columns: 1fr; } aside { display: none; } }

  aside {
    background: var(--panel); border-right: 1px solid var(--line);
    padding: 18px 14px; display: flex; flex-direction: column; gap: 18px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { font-weight: 700; font-size: 19px; letter-spacing: -.02em; }
  .brand span { color: var(--accent); }
  .side-h { font-size: 13.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--dim);
    border-radius: 999px; padding: 2px 9px; font-size: 13.5px; cursor: pointer;
  }
  .chip:hover, .chip.on { border-color: var(--accent); color: var(--accent); }
  .chip .n { opacity: .55; margin-left: 3px; }

  /* 내 태그 — 색으로 구분한다. 이름만으론 목록이 길어질수록 안 읽힌다. */
  .tagchip {
    display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
    border: 1px solid var(--tc); color: var(--tc); background: transparent;
    border-radius: 999px; padding: 4px 11px; font-size: 14px; line-height: 1.3;
  }
  .tagchip:hover { background: color-mix(in srgb, var(--tc) 12%, transparent); }
  .tagchip.on { background: var(--tc); border-color: var(--tc); color: #fff; }
  .tagchip .n { opacity: .6; font-size: 12.5px; }
  .tagrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .t-slate  { --tc: #8792a8; }
  .t-blue   { --tc: #4c86e8; }
  .t-green  { --tc: #3fa15c; }
  .t-amber  { --tc: #c98a1b; }
  .t-red    { --tc: #d5566d; }
  .t-purple { --tc: #9166d8; }
  .t-teal   { --tc: #2b9c9c; }
  .t-pink   { --tc: #cf5fa0; }

  main { padding: 20px 24px 60px; max-width: 1000px; width: 100%; }
  .capture { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
  .capture textarea {
    width: 100%; min-height: 92px; resize: vertical; background: transparent;
    border: 0; outline: none; font-size: 15px; line-height: 1.7;
  }
  .capture-bar { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .hint { color: var(--dim); font-size: 13.5px; flex: 1; }
  .btn {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px;
    padding: 6px 13px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0b0e14; font-weight: 600; }
  .btn.ghost { background: transparent; }
  .btn:disabled { opacity: .45; cursor: default; }

  .searchbar { display: flex; gap: 8px; margin: 18px 0 12px; }
  .searchbar input {
    flex: 1; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 10px 14px; outline: none;
  }
  .searchbar input:focus { border-color: var(--accent); }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; flex-wrap: wrap; }
  .tab {
    background: none; border: 0; border-bottom: 2px solid transparent; color: var(--dim);
    padding: 8px 12px; cursor: pointer;
  }
  .tab.on { color: var(--fg); border-bottom-color: var(--accent); }

  /* 주 메뉴 — 8개를 작은 글씨로 늘어놓으니 뭐가 뭔지 안 보였다.
     아이콘 + 큰 글씨 + 한 줄 설명으로 바꾸고, 성격이 다른 '관리' 항목은 떼어 놓는다. */
  .nav { display: flex; gap: 6px; flex-wrap: wrap; align-items: stretch; margin: 0 0 18px; }
  .nav .sep { width: 1px; background: var(--line); margin: 4px 8px; }
  .nav .tab {
    display: flex; flex-direction: column; gap: 1px; align-items: flex-start;
    border: 1px solid transparent; border-radius: 10px; padding: 9px 14px;
    background: var(--panel); min-width: 104px; line-height: 1.3;
  }
  .nav .tab .t { font-size: 15px; font-weight: 600; color: var(--fg); display: flex; gap: 7px; align-items: center; }
  .nav .tab .s { font-size: 12.5px; color: var(--dim); }
  .nav .tab:hover { border-color: var(--accent); }
  .nav .tab.on { background: var(--accent); border-color: var(--accent); }
  .nav .tab.on .t, .nav .tab.on .s { color: #0b0e14; }
  .nav .tab.on .s { opacity: .75; }
  @media (max-width: 1100px) { .nav .tab .s { display: none; } .nav .tab { min-width: 0; } }

  /* 화면마다 뭘 하는 곳인지 한 줄로 알려준다 */
  .lead { margin: 0 0 16px; }
  .lead h2 { margin: 0 0 4px; font-size: 21px; letter-spacing: -.02em; }
  .lead p { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.6; }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 13px 15px; margin-bottom: 9px; cursor: pointer;
  }
  .card:hover { border-color: var(--accent); }
  .card-h { display: flex; align-items: baseline; gap: 8px; }
  .card-title { font-weight: 600; flex: 1; }
  .meta { color: var(--dim); font-size: 13.5px; white-space: nowrap; }
  .snip { color: var(--dim); margin-top: 5px; font-size: 14px; }
  .snip mark { background: transparent; color: var(--accent-2); font-weight: 600; }
  .badges { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; align-items: center; }
  .badge { font-size: 13.5px; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; color: var(--dim); }
  .badge.why { border-color: var(--accent); color: var(--accent); }
  .badge.tag { color: var(--accent-2); border-color: var(--accent-2); }
  .badge.person { color: var(--warn); border-color: var(--warn); }

  .empty { color: var(--dim); text-align: center; padding: 44px 0; }
  pre.pack {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; white-space: pre-wrap; word-break: break-word; font-size: 13.5px;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace; max-height: 62vh; overflow: auto;
  }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .row label { color: var(--dim); font-size: 13.5px; }
  .row input[type=number], .row select, .row input[type=date] {
    background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px;
  }
  .todo { display: flex; gap: 9px; align-items: flex-start; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  .todo:last-child { border-bottom: 0; }
  .todo input { margin-top: 5px; accent-color: var(--accent); }
  .todo .due { color: var(--warn); font-size: 13.5px; }
  .cluster { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 15px; margin-bottom: 10px; }
  .cluster h3 { margin: 0 0 8px; font-size: 15.5px; }
  .cluster li { color: var(--dim); font-size: 14px; cursor: pointer; list-style: none; padding: 2px 0; }
  .cluster li:hover { color: var(--accent); }
  .cluster ul { margin: 0; padding: 0; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .panel h3 { margin: 0 0 6px; font-size: 16.5px; letter-spacing: -.01em; }
  .panel .desc { color: var(--dim); font-size: 13.5px; margin-bottom: 12px; line-height: 1.6; }
  .field { display: grid; grid-template-columns: 130px 1fr; gap: 10px; align-items: center; margin-bottom: 9px; }
  .field > label { color: var(--dim); font-size: 13.5px; }
  /* 체크박스는 제외한다 — width:100% 가 먹으면 칸 전체로 늘어나 이상하게 보인다. */
  .field input[type=checkbox] { width: auto; margin: 0 6px 0 0; accent-color: var(--accent); }
  .field label:has(input[type=checkbox]) { justify-self: start; display: flex; align-items: center; }
  .field input:not([type=checkbox]), .field select, .field textarea {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px;
    padding: 7px 10px; outline: none; width: 100%;
  }
  .field input:not([type=checkbox]):focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field .note { grid-column: 2; color: var(--dim); font-size: 14px; margin-top: -4px; }
  .src { display: flex; gap: 10px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .src:last-child { border-bottom: 0; }
  .src-body { flex: 1; min-width: 0; }
  .src .ok { color: var(--accent-2); } .src .no { color: var(--dim); }
  .gen-input {
    width: 100%; min-height: 76px; resize: vertical; background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 11px; outline: none; line-height: 1.7;
  }
  .gen-input:focus { border-color: var(--accent); }
  .qchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .qchip {
    background: var(--panel-2); border: 1px solid var(--accent); color: var(--accent);
    border-radius: 999px; padding: 3px 10px; font-size: 13.5px;
  }
  .qchip button { background: none; border: 0; color: inherit; cursor: pointer; padding: 0 0 0 5px; opacity: .6; }
  .qchip button:hover { opacity: 1; }
  .bar { height: 5px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .bar.over > i { background: var(--danger); }

  dialog {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: var(--radius); width: min(760px, 92vw); padding: 0;
  }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  .dlg-h { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .dlg-h .card-title { font-size: 15px; }
  .dlg-b { padding: 16px 18px; max-height: 68vh; overflow: auto; }
  .dlg-b textarea {
    width: 100%; min-height: 220px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 11px; outline: none; resize: vertical; line-height: 1.7;
  }
  .dlg-f { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
  .spacer { flex: 1; }
  .status { font-size: 13.5px; color: var(--dim); line-height: 1.6; }
  /* 숫자를 먼저 크게 — 사이드바가 작은 글씨 나열이라 아무것도 안 읽혔다 */
  .status .stat { display: flex; align-items: baseline; gap: 7px; }
  .status .stat b { font-size: 21px; color: var(--fg); font-weight: 700; }
  .status .line { height: 1px; background: var(--line); margin: 10px 0 8px; }
  .status .sub { font-size: 12.5px; opacity: .85; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
  .dot.ok { background: var(--accent-2); } .dot.warn { background: var(--warn); } .dot.err { background: var(--danger); }
  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--accent); border-radius: 8px;
    padding: 9px 18px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 99;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">memo<span>inall</span></div>

    <div>
      <div class="side-h">태그</div>
      <div class="chips" id="tags"></div>
    </div>
    <div>
      <div class="side-h">사람</div>
      <div class="chips" id="people"></div>
    </div>
    <div class="spacer"></div>
    <div class="status" id="status"></div>
  </aside>

  <main>
    <nav class="nav" id="tabs"></nav>
    <div class="lead" id="lead"></div>
    <div class="capture">
      <textarea id="capture" placeholder="생각나는 대로 적으세요.  #태그  @사람  [ ] 할일  결정: ...  은 자동으로 뽑힙니다."></textarea>
      <div id="capTags" class="tagrow" style="margin:9px 0 2px"></div>
      <div class="capture-bar">
        <span class="hint" id="captureHint">Ctrl+Enter 저장 · 형식은 신경 쓰지 마세요</span>
        <button class="btn primary" id="save">저장</button>
      </div>
    </div>

    <div class="searchbar">
      <input id="q" placeholder="의미로 검색…  (예: 결제 모듈 관련해서 걱정했던 거)" />
      <button class="btn ghost" id="exportHits" title="지금 조건에 걸리는 메모를 파일로 내보냅니다">내보내기</button>
      <button class="btn ghost" id="clear">지우기</button>
    </div>

    <div id="view"></div>
  </main>
</div>

<dialog id="detail">
  <div class="dlg-h">
    <span class="card-title" id="dTitle"></span>
    <span class="meta" id="dMeta"></span>
  </div>
  <div class="dlg-b">
    <textarea id="dBody"></textarea>
    <div class="badges" id="dBadges" style="margin-top:10px"></div>
    <div id="dSimilar" style="margin-top:14px"></div>
  </div>
  <div class="dlg-f">
    <button class="btn" id="dSave">저장</button>
    <button class="btn ghost" id="dPack">이 메모로 문서 만들기</button>
    <span class="spacer"></span>
    <button class="btn ghost" id="dDelete" style="color:var(--danger)">삭제</button>
    <button class="btn ghost" id="dClose">닫기</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
// tags 는 조회 조건(AND). tag 하나만 쓰던 시절의 사이드바 클릭도 여기로 모은다.
const state = { tab: "feed", q: "", tag: null, tags: [], person: null, memo: null };
// 정해 둔 태그 목록. 적을 때·조회할 때·내보낼 때 같은 목록을 쓴다.
let myTags = [];

const api = async (path, opts = {}) => {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  // FastAPI 는 오류를 {"detail":"..."} 로 준다. 그대로 보여주면 사용자가
  // 중괄호와 따옴표까지 읽게 된다 — 안내 문장만 꺼내 쓴다.
  if (!res.ok) {
    const raw = (await res.text()) || res.statusText;
    let msg = raw;
    try {
      const d = JSON.parse(raw).detail;
      if (typeof d === "string") msg = d;
      else if (Array.isArray(d) && d[0]?.msg) msg = d.map((e) => e.msg).join(" · ");
    } catch { /* JSON 이 아니면 원문 그대로 */ }
    throw new Error(msg);
  }
  return res.headers.get("content-type")?.includes("json") ? res.json() : res.text();
};

const esc = (s) => (s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (iso) => (iso || "").replace("T", " ").slice(0, 16);

let toastTimer;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}

function highlight(text, query) {
  if (!query) return esc(text);
  const terms = query.split(/\s+/).filter((t) => t.length >= 2).slice(0, 6);
  let out = esc(text);
  for (const t of terms) {
    const re = new RegExp(esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    out = out.replace(re, (m) => `<mark>${m}</mark>`);
  }
  return out;
}

// ---------------------------------------------------------------- 캡처
async function save() {
  const ta = $("#capture");
  const body = ta.value.trim();
  if (!body) return;
  $("#save").disabled = true;
  try {
    await api("/api/memos", { method: "POST", body: { body, source: "web" } });
    ta.value = "";
    paintTagRows();   // 골라 둔 태그도 함께 비운다
    toast("저장했습니다 — 정리는 백그라운드에서 진행됩니다");
    await Promise.all([render(), loadSidebar(), loadTags()]);
  } catch (e) {
    toast("저장 실패: " + e.message);
  } finally {
    $("#save").disabled = false;
    ta.focus();
  }
}

$("#save").onclick = save;
$("#capture").addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); save(); }
});
// 직접 #태그 를 쳐도 칩이 눌린 상태로 보여야 한다 — 본문이 원본이기 때문이다.
$("#capture").addEventListener("input", paintTagRows);

let searchTimer;
$("#q").addEventListener("input", (e) => {
  state.q = e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(render, 220);
});
$("#clear").onclick = () => { state.q = ""; state.tags = []; state.person = null; $("#q").value = ""; loadSidebar(); render(); };

// 검색으로 좁힌 그대로 내보내기. 조건을 주고받기 화면에 옮겨 담고 목록부터 보여준다 —
// 남에게 보내는 파일이라 무엇이 나가는지 확인 없이 저장되면 안 된다.
$("#exportHits").onclick = async () => {
  exp.q = state.q || "";
  exp.tags = [...state.tags];
  await goTab("import");
  if ($("#expPreview")) doExportPreview();
};

// 메뉴 정의 — 이름만 보고 뭘 하는 곳인지 알 수 있어야 한다.
// 예전 이름(주제/브리핑/생성/컨텍스트 팩)은 내부 용어라 처음 보면 뜻을 알 수 없었다.
const TABS = [
  { id: "feed", icon: "📝", name: "메모", sub: "적고 찾기",
    title: "메모", lead: "생각나는 대로 적어두고, 의미로 찾습니다. 형식은 신경 쓰지 마세요." },
  { id: "todos", icon: "✅", name: "할 일", sub: "자동 추출",
    title: "할 일", lead: "메모에서 자동으로 뽑아낸 할 일입니다. 체크하면 목록에서 사라집니다." },
  { id: "clusters", icon: "🧩", name: "주제별", sub: "자동 묶음",
    title: "주제별 묶음", lead: "비슷한 내용끼리 자동으로 묶었습니다. 태그를 달지 않아도 주제가 드러납니다." },
  { id: "rollup", icon: "📅", name: "기간 요약", sub: "일·주·월",
    title: "기간 요약", lead: "고른 기간의 메모에서 결정·할 일·열린 질문을 모아 보여줍니다." },
  { id: "generate", icon: "✨", name: "AI 문서", sub: "메모로 만들기",
    title: "메모로 문서 만들기", lead: "지시사항을 적으면 관련 메모를 찾아 근거로 삼고 결과물을 씁니다." },
  { sep: true },
  { id: "import", icon: "📥", name: "주고받기", sub: "가져오기·내보내기",
    title: "메모 주고받기",
    lead: "동료에게 파일로 보내거나 받고, 스티커 메모·Samsung Notes·Redmine·텍스트 폴더에서 가져옵니다." },
  { id: "settings", icon: "⚙️", name: "설정", sub: "AI·검색",
    title: "설정", lead: "어떤 AI 를 쓸지, 검색용 임베딩은 어떤 상태인지 여기서 봅니다." },
];
const TAB_BY_ID = Object.fromEntries(TABS.filter((t) => t.id).map((t) => [t.id, t]));

function renderTabs() {
  $("#tabs").innerHTML = TABS.map((t) => t.sep
    ? '<div class="sep"></div>'
    : `<button class="tab ${state.tab === t.id ? "on" : ""}" data-tab="${t.id}" title="${esc(t.lead)}">
         <span class="t">${t.icon} ${esc(t.name)}</span><span class="s">${esc(t.sub)}</span>
       </button>`).join("");
  $("#tabs").querySelectorAll("[data-tab]").forEach((b) => {
    b.onclick = () => { goTab(b.dataset.tab); };
  });
}

function goTab(id) {
  state.tab = id;
  renderTabs();
  return render();   // 화면이 다 그려진 뒤에 이어서 할 일이 있는 호출자를 위해
}

// ---------------------------------------------------------------- 내 태그
// 태그의 원본은 언제나 메모 본문의 `#태그` 다. 칩은 그 본문을 고치는 손잡이일 뿐이라
// 사용자는 저장 전에 무엇이 들어갈지 글로 직접 확인할 수 있다.
const TAG_CHARS = "0-9A-Za-z가-힣_/\\-";

async function loadTags() {
  try {
    const r = await api("/api/tags");
    myTags = r.items || [];
  } catch { myTags = []; }
  paintTagRows();
}

function bodyTags(text) {
  return [...String(text || "").matchAll(new RegExp(`(?:^|\\s)#([${TAG_CHARS}]{1,40})`, "g"))]
    .map((m) => m[1]);
}

function tagChip(t, active, attrs = "") {
  return `<button type="button" class="tagchip t-${esc(t.color || "slate")} ${active ? "on" : ""}"
    data-tag="${esc(t.name)}" ${attrs} title="${esc(t.note || "")}">#${esc(t.name)}${
    t.count ? `<span class="n">${t.count}</span>` : ""}</button>`;
}

// 적는 칸의 칩 — 누르면 본문에서 #태그가 붙었다 떨어진다.
function paintTagRows() {
  const row = $("#capTags");
  if (!row) return;
  if (!myTags.length) {
    row.innerHTML = `<span class="hint">자주 쓰는 태그를 정해 두면 여기서 눌러 넣을 수 있습니다 —
      <a href="#" data-go="settings" style="color:var(--accent)">설정에서 만들기</a></span>`;
    row.querySelector("[data-go]").onclick = (e) => { e.preventDefault(); goTab("settings"); };
    return;
  }
  const inBody = new Set(bodyTags($("#capture").value).map((t) => t.toLowerCase()));
  row.innerHTML = myTags.map((t) => tagChip(t, inBody.has(t.name.toLowerCase()))).join("")
    + `<span class="hint" style="margin-left:4px">눌러서 태그 넣기</span>`;
  row.querySelectorAll("[data-tag]").forEach((b) => {
    b.onclick = () => toggleTagInCapture(b.dataset.tag);
  });
}

function toggleTagInCapture(name) {
  const box = $("#capture");
  const re = new RegExp(`(^|\\s)#${name.replace(/[.*+?^${}()|[\\]\\\\]/g, "\\\\$&")}(?![${TAG_CHARS}])`, "g");
  if (re.test(box.value)) {
    box.value = box.value.replace(re, "$1").replace(/[ \t]+\n/g, "\n").replace(/[ \t]{2,}/g, " ").trim();
  } else {
    box.value = (box.value.trim() ? box.value.replace(/\s+$/, "") + " " : "") + "#" + name + " ";
  }
  box.focus();
  paintTagRows();
}

function toggleTagFilter(name) {
  state.tags = state.tags.includes(name)
    ? state.tags.filter((t) => t !== name)
    : [...state.tags, name];
  loadSidebar();
  render();
}

// ---------------------------------------------------------------- 사이드바
async function loadSidebar() {
  const [tags, people, stats] = await Promise.all([
    api("/api/facets/tag?limit=24"), api("/api/facets/person?limit=16"), api("/api/stats"),
  ]);
  // 태그는 여러 개를 겹쳐 고를 수 있다(전부 달린 메모만). 사람은 하나만.
  const on = (key, v) => (key === "tag" ? state.tags.includes(v) : state[key] === v);
  const chips = (items, key, prefix) =>
    items.map((i) => `<span class="chip ${on(key, i.value) ? "on" : ""}" data-k="${key}" data-v="${esc(i.value)}">${prefix}${esc(i.value)}<span class="n">${i.count}</span></span>`).join("") || `<span class="status">없음</span>`;
  $("#tags").innerHTML = chips(tags.items, "tag", "#");
  $("#people").innerHTML = chips(people.items, "person", "@");
  document.querySelectorAll(".chip").forEach((c) => {
    c.onclick = () => {
      if (c.dataset.k === "tag") toggleTagFilter(c.dataset.v);
      else { state.person = state.person === c.dataset.v ? null : c.dataset.v; loadSidebar(); render(); }
    };
  });

  const e = stats.embedder;
  const cls = e.state === "ready" ? "ok" : e.state === "failed" ? "err" : "warn";
  const label = {
    ready: "의미 검색 활성", loading: "모델 로딩 중…", downloading: "모델 내려받는 중",
    fallback: "폴백 임베더", failed: "폴백 임베더(모델 실패)",
  }[e.state] || e.state;
  // 첫 실행 때 약 450MB 를 받는다. 진행률을 안 보여주면 멈춘 것처럼 보인다.
  const dl = e.state === "downloading" && e.progress?.total
    ? `<div class="bar"><i style="width:${e.progress.percent}%"></i></div>
       <div>${e.progress.percent}% · ${Math.round(e.progress.done / 1048576)}/${Math.round(e.progress.total / 1048576)} MB</div>`
    : "";
  const busy = stats.queue ? ` <span style="color:var(--warn)">· 정리 중 ${stats.queue}</span>` : "";
  $("#status").innerHTML = `
    <div class="stat"><b>${stats.memos}</b><span>메모</span></div>
    <div class="stat"><b>${stats.open_todos}</b><span>남은 할 일</span></div>
    <div class="line"></div>
    <div><span class="dot ${cls}"></span>${label}${busy}</div>
    ${dl}
    <div class="sub">검색 엔진 ${esc(e.model)}</div>
    <div class="sub">AI ${stats.llm_enabled
      ? `${esc(stats.llm_provider)} · ${esc(stats.llm_model)}`
      : `<a href="#" data-go="settings" style="color:var(--accent)">미설정 — 지금 연결</a>`}</div>`;
  document.querySelectorAll("#status [data-go]").forEach((a) => {
    a.onclick = (ev) => { ev.preventDefault(); goTab(a.dataset.go); };
  });
}

// ---------------------------------------------------------------- 렌더
async function render() {
  const view = $("#view");
  // 메모 입력창과 검색창은 '메모' 화면 전용이다. 다른 화면에서는 검색어가 아예
  // 쓰이지 않는데도 검색창이 떠 있어서 "쳐도 아무 일이 없는" 상태였다.
  const onFeed = state.tab === "feed";
  document.querySelector(".searchbar").style.display = onFeed ? "flex" : "none";
  document.querySelector(".capture").style.display = onFeed ? "block" : "none";

  // 화면마다 제목 + 한 줄 설명. 탭 이름만으로 뭘 하는 곳인지 모르겠다는 게 문제였다.
  const t = TAB_BY_ID[state.tab];
  const lead = $("#lead");
  if (t) {
    lead.innerHTML = `<h2>${t.icon} ${esc(t.title)}</h2><p>${esc(t.lead)}</p>`;
    lead.style.display = "block";
  } else {
    lead.style.display = "none";
  }

  view.innerHTML = `<div class="empty">불러오는 중…</div>`;
  try {
    const views = {
      feed: renderFeed, todos: renderTodos, clusters: renderClusters, rollup: renderRollup,
      generate: renderGenerate, import: renderImport, settings: renderSettings,
    };
    await (views[state.tab] || renderFeed)();
  } catch (e) {
    view.innerHTML = `<div class="empty">오류: ${esc(e.message)}</div>`;
  }
}

function qs(extra = {}) {
  const p = new URLSearchParams();
  if (state.tags.length) p.set("tags", state.tags.join(","));
  if (state.person) p.set("person", state.person);
  for (const [k, v] of Object.entries(extra)) if (v !== null && v !== undefined && v !== "") p.set(k, v);
  return p.toString();
}

function cardHTML(m) {
  const f = m.facets || {};
  const badges = [
    m.why ? `<span class="badge why">${esc(m.why)}</span>` : "",
    ...(f.tag || []).slice(0, 5).map((t) => `<span class="badge tag">#${esc(t)}</span>`),
    ...(f.person || []).slice(0, 3).map((p) => `<span class="badge person">@${esc(p)}</span>`),
    (m.todos || []).some((t) => !t.done) ? `<span class="badge">할일 ${m.todos.filter((t) => !t.done).length}</span>` : "",
  ].filter(Boolean).join("");
  return `<div class="card" data-id="${m.id}">
    <div class="card-h"><span class="card-title">${esc(m.title)}</span><span class="meta">${fmt(m.created_at)}</span></div>
    <div class="snip">${highlight(m.snippet || m.body.slice(0, 200), state.q)}</div>
    <div class="badges">${badges}</div>
  </div>`;
}

function bindCards() {
  document.querySelectorAll(".card[data-id]").forEach((c) => (c.onclick = () => openMemo(+c.dataset.id)));
  // 빈 화면 안내의 '다른 앱에서 가져오기' 같은 이동 링크
  document.querySelectorAll("[data-go]").forEach((a) => {
    a.onclick = (e) => { e.preventDefault(); goTab(a.dataset.go); };
  });
}

async function renderFeed() {
  const tagArg = state.tags.join(",");
  const data = state.q.trim()
    ? await api("/api/search?" + qs({ q: state.q, limit: 30, tags: tagArg }))
    : await api("/api/memos?" + qs({ limit: 40, tags: tagArg }));
  const items = data.items || [];
  // 조사(이/가)는 태그 이름의 받침에 따라 달라진다 — 가운뎃점으로 피한다.
  const filtered = state.tags.length
    ? `<div class="status" style="margin-bottom:10px">${state.tags.map((t) => "#" + esc(t)).join(" + ")}
         · ${state.tags.length > 1 ? "모두 달린 " : ""}메모 ${items.length}건 —
         <a href="#" id="clearTagFilter" style="color:var(--accent)">조건 해제</a></div>`
    : "";
  $("#view").innerHTML = items.length
    ? filtered + (state.q.trim() ? `<div class="status" style="margin-bottom:10px">${items.length}건 — 뜻이 비슷한 메모까지 함께 찾았습니다</div>` : "") + items.map(cardHTML).join("")
    : filtered + `<div class="empty">${state.q || state.tags.length
        ? `조건에 맞는 메모가 없습니다.<br/><span style="font-size:14px">태그를 하나만 남기거나, 다른 말로 바꿔 보세요 —
           정확한 단어가 아니어도 뜻이 비슷하면 찾습니다.</span>`
        : `아직 메모가 없습니다.<br/><span style="font-size:14px">위 칸에 아무거나 적고 <b>Ctrl+Enter</b> 를 누르거나,
           <a href="#" data-go="import" style="color:var(--accent)">다른 앱에서 가져오기</a> 로 시작하세요.</span>`}</div>`;
  const clearBtn = $("#clearTagFilter");
  if (clearBtn) clearBtn.onclick = (e) => { e.preventDefault(); state.tags = []; paintTagRows(); render(); };
  bindCards();
}

async function renderTodos() {
  const { items } = await api("/api/todos?limit=200");
  if (!items.length) {
    $("#view").innerHTML = `<div class="empty">아직 할 일이 없습니다.<br/>
      <span style="font-size:14px">메모에 <b>[ ]</b> 를 쓰거나 "~해야 함", "~할 것" 처럼 적으면 자동으로 잡힙니다.</span></div>`;
    return;
  }
  $("#view").innerHTML = `<div class="card" style="cursor:default;padding:0">` + items.map((t) => `
    <div class="todo">
      <input type="checkbox" data-todo="${t.id}" />
      <div style="flex:1">
        <div>${esc(t.text)}</div>
        <div class="meta">${t.due ? `<span class="due">마감 ${t.due}</span> · ` : ""}<a href="#" data-memo="${t.memo_id}" style="color:var(--dim)">${esc(t.memo_title)}</a></div>
      </div>
    </div>`).join("") + `</div>`;
  document.querySelectorAll("[data-todo]").forEach((c) => {
    c.onchange = async () => { await api(`/api/todos/${c.dataset.todo}`, { method: "PATCH", body: { done: c.checked } }); render(); loadSidebar(); };
  });
  document.querySelectorAll("[data-memo]").forEach((a) => {
    a.onclick = (e) => { e.preventDefault(); openMemo(+a.dataset.memo); };
  });
}

async function renderClusters() {
  const { clusters } = await api("/api/clusters");
  if (!clusters.length) {
    $("#view").innerHTML = `<div class="empty">묶을 메모가 아직 없습니다.<br/>
      <span style="font-size:14px">메모가 몇 개 쌓이면 비슷한 것끼리 자동으로 묶입니다.
      (방금 넣었다면 정리 중일 수 있어요)</span></div>`;
    return;
  }
  $("#view").innerHTML =
    clusters.map((c) => `<div class="cluster">
      <h3>${esc(c.label)} <span class="meta">${c.size}건</span></h3>
      <ul>${c.memos.map((m) => `<li data-memo="${m.id}">· ${esc(m.title)} <span class="meta">${fmt(m.created_at)}</span></li>`).join("")}</ul>
    </div>`).join("");
  document.querySelectorAll("[data-memo]").forEach((li) => (li.onclick = () => openMemo(+li.dataset.memo)));
}

async function renderRollup() {
  const period = state.period || "week";
  const d = await api(`/api/rollup?period=${period}`);
  const list = (title, arr, fn) => arr.length ? `<div class="cluster"><h3>${title} <span class="meta">${arr.length}</span></h3><ul>${arr.map(fn).join("")}</ul></div>` : "";
  $("#view").innerHTML = `
    <div class="row">
      <label>기간</label>
      <select id="period">
        <option value="day"${period === "day" ? " selected" : ""}>오늘</option>
        <option value="week"${period === "week" ? " selected" : ""}>이번 주</option>
        <option value="month"${period === "month" ? " selected" : ""}>이번 달</option>
      </select>
      <span class="meta">${d.start} ~ ${d.end} · 메모 ${d.memo_count}건</span>
      <span class="spacer"></span>
      <button class="btn" id="copyRollup">브리핑 재료 복사</button>
      <button class="btn primary" id="genDigest">AI 브리핑 생성</button>
    </div>
    <div id="digestOut"></div>
    ${list("결정/결론", d.decisions, (x) => `<li data-memo="${x.memo_id}">· ${esc(x.text)}</li>`)}
    ${list("미완 할일", d.todos_open, (x) => `<li data-memo="${x.memo_id}">· ${esc(x.text)}${x.due ? ` <span class="due">(${x.due})</span>` : ""}</li>`)}
    ${list("열린 질문", d.questions, (x) => `<li data-memo="${x.memo_id}">· ${esc(x.text)}</li>`)}
    ${list("주제 묶음", d.clusters, (c) => `<li>· ${esc(c.label)} (${c.size}건)</li>`)}
    <details style="margin-top:12px"><summary class="status" style="cursor:pointer">브리핑 재료 원문 보기</summary><pre class="pack">${esc(d.prompt)}</pre></details>`;

  $("#period").onchange = (e) => { state.period = e.target.value; render(); };
  $("#copyRollup").onclick = () => { navigator.clipboard.writeText(d.prompt); toast("복사했습니다 — LLM 에 그대로 붙여넣으세요"); };
  $("#genDigest").onclick = async () => {
    const out = $("#digestOut");
    out.innerHTML = `<div class="status">생성 중…</div>`;
    const r = await api("/api/digest", { method: "POST", body: { period } });
    out.innerHTML = r.digest
      ? `<pre class="pack">${esc(r.digest)}</pre>`
      : `<div class="status" style="margin-bottom:8px">${esc(r.reason)}</div><pre class="pack">${esc(r.prompt)}</pre>`;
  };
  document.querySelectorAll("[data-memo]").forEach((li) => (li.onclick = () => openMemo(+li.dataset.memo)));
}

// ---------------------------------------------------------------- 생성
// 지시사항 → (검색 질의 도출) → 근거 검색 → 결과물.
// 중간의 '검색 질의'를 감추지 않고 보여주고 고칠 수 있게 한 게 핵심이다.
// 왜 그 근거가 뽑혔는지 안 보이면 결과물을 믿을 수 없기 때문.
const gen = { instruction: "", format: "auto", queries: null, plan: null, output: null, busy: false };

async function renderGenerate() {
  const { formats, llm_ready, provider } = await api("/api/generate/formats");
  const fmtOptions = formats.map((f) => `<option value="${f.key}"${gen.format === f.key ? " selected" : ""}>${esc(f.label)}</option>`).join("");

  $("#view").innerHTML = `
    <div class="panel">
      <h3>무엇을 만들까요?</h3>
      <div class="desc">
        관련 메모를 <b>여러 각도로 검색</b>해 근거로 삼습니다.
        어떤 말로 검색했는지 아래에 그대로 보여주니, 엉뚱하면 직접 고치세요.
        ${llm_ready
          ? `<br/><span class="meta">생성 엔진: ${esc(provider)}</span>`
          : `<br/><span style="color:var(--warn)">${esc(provider)} 설정이 없어 프롬프트까지만 만듭니다 — 설정 탭에서 등록하거나 복사해서 쓰세요.</span>`}
      </div>
      <textarea class="gen-input" id="genInput" placeholder="예) 연수원 AX 세미나 내용으로 교육과정 기획안 초안 써줘&#10;예) 이번 분기에 결정된 것만 모아서 팀 공유용으로 정리해줘">${esc(gen.instruction)}</textarea>
      <div class="row" style="margin:10px 0 0">
        <label>형식</label>
        <select id="genFormat" style="min-width:130px">${fmtOptions}</select>
        <label>근거 예산</label>
        <input type="number" id="genBudget" value="${gen.plan?.budget_tokens || 6000}" min="500" step="500" style="width:95px" />
        <span class="spacer"></span>
        <button class="btn" id="genPlan">근거 먼저 보기</button>
        <button class="btn primary" id="genRun">${llm_ready ? "생성" : "프롬프트 만들기"}</button>
      </div>
    </div>
    <div id="genPlanOut"></div>
    <div id="genOut"></div>`;

  $("#genInput").oninput = (e) => { gen.instruction = e.target.value; };
  $("#genInput").onkeydown = (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); runGenerate(); } };
  $("#genFormat").onchange = (e) => { gen.format = e.target.value; };
  $("#genPlan").onclick = () => planGenerate();
  $("#genRun").onclick = () => runGenerate();

  if (gen.plan) renderPlanPanel();
  if (gen.output !== null) renderGenOutput();
}

function genPayload() {
  return {
    instruction: gen.instruction.trim(),
    format: gen.format,
    budget: +($("#genBudget")?.value || 6000),
    queries: gen.queries,
    tags: state.tags, person: state.person,
  };
}

async function planGenerate() {
  if (!gen.instruction.trim()) { toast("지시사항을 먼저 적어주세요"); return; }
  $("#genPlanOut").innerHTML = `<div class="status">근거 찾는 중…</div>`;
  gen.plan = await api("/api/generate/plan", { method: "POST", body: genPayload() });
  gen.queries = gen.plan.queries.slice();
  renderPlanPanel();
}

function renderPlanPanel() {
  const p = gen.plan;
  const pct = Math.min(100, Math.round((p.used_tokens / p.budget_tokens) * 100));
  const chips = (gen.queries || []).map((q, i) =>
    `<span class="qchip">${esc(q)}<button data-delq="${i}" title="이 질의 빼기">×</button></span>`).join("");

  $("#genPlanOut").innerHTML = `
    <div class="panel">
      <h3>검색 질의 <span class="meta">${p.query_method === "llm" ? "AI가 도출" : p.query_method === "manual" ? "직접 지정" : "규칙으로 도출"}</span></h3>
      <div class="qchips">${chips || '<span class="status">질의 없음</span>'}
        <input id="addQ" placeholder="+ 질의 추가 후 Enter" style="background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px 11px;outline:none;width:200px" />
      </div>
      <div class="desc" style="margin:12px 0 6px">
        근거 <b>${p.sources.length}건</b> · ${p.used_tokens} / ${p.budget_tokens} 토큰
        ${p.dropped.length ? ` · <span style="color:var(--warn)">예산 초과로 제외 ${p.dropped.length}건</span>` : ""}
      </div>
      <div class="bar ${pct >= 100 ? "over" : ""}"><i style="width:${pct}%"></i></div>
      <div style="margin-top:12px">
        ${p.sources.map((s) => `<div class="src">
          <div class="src-body">
            <div><b>[M${s.id}]</b> ${esc(s.title)} <span class="meta">${s.created_at.slice(0, 10)}</span></div>
            <div class="meta">일치 질의: ${s.matched_queries.map(esc).join(" / ")}</div>
          </div>
          <button class="btn ghost" data-openmemo="${s.id}" style="padding:3px 9px;font-size:13.5px">열기</button>
        </div>`).join("") || `<div class="status">관련 메모를 찾지 못했습니다. 질의를 바꿔보세요.</div>`}
      </div>
      <div class="row" style="margin:14px 0 0">
        <button class="btn" id="copyGenPrompt">프롬프트 복사</button>
        <span class="spacer"></span>
        <button class="btn primary" id="genRun2">이 근거로 생성</button>
      </div>
      <details style="margin-top:10px"><summary class="status" style="cursor:pointer">조립된 프롬프트 보기</summary><pre class="pack">${esc(p.prompt)}</pre></details>
    </div>`;

  document.querySelectorAll("[data-delq]").forEach((b) => {
    b.onclick = () => { gen.queries.splice(+b.dataset.delq, 1); planWithQueries(); };
  });
  document.querySelectorAll("[data-openmemo]").forEach((b) => (b.onclick = () => openMemo(+b.dataset.openmemo)));
  $("#addQ").onkeydown = (e) => {
    if (e.key !== "Enter" || !e.target.value.trim()) return;
    gen.queries.push(e.target.value.trim());
    e.target.value = "";
    planWithQueries();
  };
  $("#copyGenPrompt").onclick = () => { navigator.clipboard.writeText(p.prompt); toast("프롬프트를 복사했습니다"); };
  $("#genRun2").onclick = () => runGenerate();
}

async function planWithQueries() {
  $("#genPlanOut").innerHTML = `<div class="status">다시 검색 중…</div>`;
  gen.plan = await api("/api/generate/plan", { method: "POST", body: genPayload() });
  renderPlanPanel();
}

async function runGenerate() {
  if (!gen.instruction.trim()) { toast("지시사항을 먼저 적어주세요"); return; }
  if (gen.busy) return;
  gen.busy = true;
  $("#genOut").innerHTML = `<div class="panel"><div class="status">생성 중… 근거를 모으고 쓰는 중입니다.</div></div>`;
  try {
    const r = await api("/api/generate", { method: "POST", body: genPayload() });
    gen.plan = r;
    gen.queries = r.queries.slice();
    gen.output = r;
    renderPlanPanel();
    renderGenOutput();
  } catch (e) {
    $("#genOut").innerHTML = `<div class="panel"><div class="status">실패: ${esc(e.message)}</div></div>`;
  } finally {
    gen.busy = false;
  }
}

function renderGenOutput() {
  const r = gen.output;
  if (r.output) {
    $("#genOut").innerHTML = `
      <div class="panel">
        <div class="row" style="margin:0 0 10px">
          <h3 style="margin:0">결과물</h3>
          <span class="meta">근거 ${r.sources.length}건 · [M{id}] 는 출처 메모</span>
          <span class="spacer"></span>
          <button class="btn" id="copyOut">복사</button>
          <button class="btn ghost" id="dlOut">파일로</button>
        </div>
        <pre class="pack" style="border-color:var(--accent);max-height:none">${esc(r.output)}</pre>
      </div>`;
    $("#copyOut").onclick = () => { navigator.clipboard.writeText(r.output); toast("복사했습니다"); };
    $("#dlOut").onclick = async () => {
      const name = `memoinall-${r.instruction.slice(0, 20).replace(/[^\w가-힣]+/g, "_")}.md`;
      // 데스크톱 앱(WebView2)은 blob: 다운로드를 무시한다 — 네이티브 저장 대화상자로.
      if (window.pywebview?.api?.save) {
        const ok = await window.pywebview.api.save(r.output, name);
        toast(ok ? "저장했습니다" : "저장을 취소했습니다");
        return;
      }
      const blob = new Blob([r.output], { type: "text/markdown;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      URL.revokeObjectURL(a.href);
    };
  } else {
    $("#genOut").innerHTML = `<div class="panel"><div class="status">${esc(r.reason || "결과 없음")}</div></div>`;
  }
}

// ---------------------------------------------------------------- 가져오기
// 소스별 결과를 각자 자리에 남긴다. 하나를 가져와도 다른 소스의 결과가 지워지지 않는다.
const imp = { path: "", sharedPath: "", minChars: 0, update: false, tags: [], results: {} };
// 내보내기 조건. 조건들은 AND 로 겹친다 — '결제 + 지난달' 처럼 좁혀 보낼 수 있어야 한다.
const exp = { q: "", tag: "", tags: [], since: "", until: "", archived: false, note: "" };
const RM_KINDS = { issues: "이슈", wiki: "위키", documents: "문서", news: "공지" };

// 소스 한 칸: 상태 + 자기 버튼 + 자기 결과. '일괄'도 같은 칸에 결과를 흘려보낸다.
function sourceCard(x, extra = "") {
  const disabled = x.available ? "" : "disabled";
  return `<div class="src" style="align-items:stretch">
    <div class="src-body">
      <div><b>${esc(x.label)}</b>
        <span class="${x.available ? "ok" : "no"}">${x.available ? "● 사용 가능" : "○ 없음"}</span>
        ${x.network ? '<span class="badge">네트워크</span>' : ""}</div>
      <div class="meta" style="word-break:break-all">${esc(x.available ? x.path : x.reason)}</div>
      ${extra}
      <div class="row" style="margin:9px 0 0">
        <span class="spacer"></span>
        <button class="btn" data-src-preview="${x.name}" ${disabled}>미리보기</button>
        <button class="btn primary" data-src-run="${x.name}" ${disabled}>가져오기</button>
      </div>
      ${resetRow(x)}
      <div id="impOut-${x.name}"></div>
    </div>
  </div>`;
}

// 이 앱에서 가져온 메모를 통째로 지우는 줄. 원본을 못 읽는 상태여도(앱 삭제,
// 서버 접속 불가) 이미 들어온 데이터는 지울 수 있어야 하므로 available 과 무관하다.
function resetRow(x) {
  const st = x.stored || { memos: 0 };
  if (!st.memos) {
    return `<div class="meta" style="margin-top:8px">아직 이 앱에서 가져온 메모가 없습니다.</div>`;
  }
  const span = st.first ? ` <span class="meta">· ${esc(st.first)} ~ ${esc(st.last)}</span>` : "";
  return `<div class="row" style="margin-top:8px;gap:8px">
      <span class="meta">가져와 있는 메모 <b style="color:var(--fg)">${st.memos}건</b>${span}</span>
      <span class="spacer"></span>
      <button class="btn ghost" data-src-reset="${x.name}" data-n="${st.memos}"
              style="color:var(--danger)">전부 삭제</button>
    </div>
    <div id="impReset-${x.name}"></div>`;
}

function askReset(name, n) {
  const el = $(`#impReset-${name}`);
  if (!el) return;
  // 한 번 더 묻는다 — 되돌릴 수 없는데다, 지우는 양이 클수록 오조작 대가가 크다.
  el.innerHTML = `<div style="margin-top:9px;padding:10px 12px;border:1px solid var(--danger);border-radius:8px">
      <div><b style="color:var(--danger)">${esc(name)} 에서 가져온 메모 ${n}건을 지웁니다.</b></div>
      <div class="note" style="margin-top:4px">
        딸린 할 일·태그·임베딩도 같이 지워지고, memoinall 안에서 고친 내용도 사라집니다.
        <b>되돌릴 수 없습니다.</b> 직접 쓴 메모와 다른 앱에서 가져온 메모는 그대로 둡니다.
      </div>
      <div class="row" style="margin-top:10px">
        <span class="spacer"></span>
        <button class="btn" data-reset-cancel>취소</button>
        <button class="btn primary" data-reset-go
                style="background:var(--danger);border-color:var(--danger)">${n}건 지우기</button>
      </div>
    </div>`;
  el.querySelector("[data-reset-cancel]").onclick = () => { el.innerHTML = ""; };
  el.querySelector("[data-reset-go]").onclick = () => doReset(name, el);
}

async function doReset(name, el) {
  el.innerHTML = `<div class="status" style="margin-top:9px">지우는 중…</div>`;
  try {
    const r = await api("/api/import/reset", { method: "POST", body: { source: name, confirm: true } });
    delete imp.results[name];  // 지워진 데이터의 옛 가져오기 결과가 남아 있으면 오해를 부른다
    toast(r.deleted ? `${name} 메모 ${r.deleted}건을 지웠습니다` : "지울 메모가 없었습니다");
    loadSidebar();
    render();
  } catch (err) {
    el.innerHTML = `<div class="status" style="color:var(--danger);margin-top:9px">${esc(err.message)}</div>`;
  }
}

        <button class="btn" id="rmSave">저장</button>
        <button class="btn" data-src-preview="redmine">미리보기</button>
        <button class="btn primary" data-src-run="redmine">가져오기</button>
      </div>
      <div id="rmOut" style="margin-top:10px"></div>
      ${resetRow(byName.redmine)}
      <div id="impOut-redmine"></div>
    </div>`;

  $("#impPath").onchange = (e) => { imp.path = e.target.value.trim(); render(); };
  $("#impShared").onchange = (e) => { imp.sharedPath = e.target.value.trim(); render(); };
  $("#expQ").onchange = (e) => { exp.q = e.target.value.trim(); };
  document.querySelectorAll("#expTagRow [data-tag]").forEach((b) => {
    b.onclick = () => {
      const n = b.dataset.tag;
      exp.tags = exp.tags.includes(n) ? exp.tags.filter((t) => t !== n) : [...exp.tags, n];
      b.classList.toggle("on");
    };
  });
  document.querySelectorAll("#impTagRow [data-tag]").forEach((b) => {
    b.onclick = () => {
      const n = b.dataset.tag;
      imp.tags = imp.tags.includes(n) ? imp.tags.filter((t) => t !== n) : [...imp.tags, n];
      b.classList.toggle("on");
    };
  });
  $("#expSince").onchange = (e) => { exp.since = e.target.value.trim(); };
  $("#expUntil").onchange = (e) => { exp.until = e.target.value.trim(); };
  $("#expNote").onchange = (e) => { exp.note = e.target.value; };
  $("#expArchived").onchange = (e) => { exp.archived = e.target.checked; };
  $("#expPreview").onclick = doExportPreview;
  $("#expSave").onclick = doExportSave;
  $("#expCopy").onclick = doExportCopy;
  $("#impMin").onchange = (e) => { imp.minChars = +e.target.value || 0; };
  $("#impUpdate").onchange = (e) => { imp.update = e.target.checked; };
  $("#impPreviewAll").onclick = () => doImport(true, "all");
  $("#impRunAll").onclick = () => doImport(false, "all");
  document.querySelectorAll("[data-src-preview]").forEach((b) => {
    b.onclick = () => doImport(true, b.dataset.srcPreview);
  });
  document.querySelectorAll("[data-src-run]").forEach((b) => {
    b.onclick = () => doImport(false, b.dataset.srcRun);
  });
  document.querySelectorAll("[data-src-reset]").forEach((b) => {
    b.onclick = () => askReset(b.dataset.srcReset, +b.dataset.n);
  });

  // 이전 결과를 각 소스 칸에 되살린다 (탭을 다시 그려도 남아 있게)
  Object.entries(imp.results).forEach(([name, res]) => paintResult(name, res));

  document.querySelectorAll("[data-kind]").forEach((c) => {
    c.onchange = () => c.closest("label").classList.toggle("on", c.checked);
  });
  $("#rmTest").onclick = async () => {
    $("#rmOut").innerHTML = `<div class="status">확인 중…</div>`;
    const r = await api("/api/import/redmine/test", { method: "POST", body: redminePayload() });
    $("#rmOut").innerHTML = `<div class="status" style="color:${r.ok ? "var(--accent-2)" : "var(--danger)"}">${r.ok ? "✓" : "✗"} ${esc(r.message)}</div>`;
  };
  $("#rmLoadProjects").onclick = async (e) => {
    e.preventDefault();
    $("#rmOut").innerHTML = `<div class="status">프로젝트 목록 조회 중…</div>`;
    try {
      const r = await api("/api/import/redmine/projects", { method: "POST", body: redminePayload() });
      $("#rmOut").innerHTML = r.projects.length
        ? `<div class="status">프로젝트 ${r.projects.length}개: ${r.projects.map((p) => esc(p.id)).join(", ")}</div>`
        : `<div class="status">프로젝트를 찾지 못했습니다.</div>`;
    } catch (err) {
      $("#rmOut").innerHTML = `<div class="status" style="color:var(--danger)">${esc(err.message)}</div>`;
    }
  };
  $("#rmSave").onclick = async () => {
    const p = redminePayload();
    const values = {
      "import.redmine.url": p.url,
      "import.redmine.projects": p.projects,
      "import.redmine.kinds": p.kinds,
      "import.redmine.limit": String(p.limit),
      "import.redmine.since": p.since,
    };
    if (p.api_key) values["import.redmine.api_key"] = p.api_key;
    await api("/api/settings", { method: "PUT", body: { values } });
    toast("Redmine 설정을 저장했습니다");
    render();
  };
}

// ---------------------------------------------------------------- 내보내기
// 입력칸에서 바로 읽는다 — 타이핑 직후 눌러도 방금 친 값이 반영돼야 한다.
function exportPayload() {
  if (!$("#expQ")) return {};
  exp.q = $("#expQ").value.trim();
  // 칩으로 고른 것 + 직접 적은 것. 둘 다 AND 로 겹친다.
  const typed = $("#expTag").value.split(",").map((t) => t.trim().replace(/^#/, "")).filter(Boolean);
  exp.tag = $("#expTag").value.trim();
  exp.since = $("#expSince").value.trim();
  exp.until = $("#expUntil").value.trim();
  exp.note = $("#expNote").value;
  exp.archived = $("#expArchived").checked;
  const all = [...new Set([...exp.tags, ...typed])];
  return { ...exp, tag: null, tags: all };
}

function expBusy(msg) { $("#expOut").innerHTML = `<div class="status" style="margin-top:9px">${msg}</div>`; }
function expError(msg) {
  $("#expOut").innerHTML = `<div class="status" style="margin-top:9px;color:var(--danger)">${esc(msg)}</div>`;
}

async function doExportPreview() {
  expBusy("고르는 중…");
  try {
    const r = await api("/api/export/preview", { method: "POST", body: exportPayload() });
    if (!r.count) {
      $("#expOut").innerHTML = `<div class="status" style="margin-top:9px">조건에 맞는 메모가 없습니다.</div>`;
      return;
    }
    const rows = r.items.map((m) => `<div class="meta">· ${esc((m.created_at || "").slice(0, 10))}
      ${esc(m.title || "")} ${m.source && m.source !== "web" ? `<span class="badge">${esc(m.source)}</span>` : ""}</div>`).join("");
    $("#expOut").innerHTML = `<div style="margin-top:10px;padding:10px 12px;background:var(--panel-2);border-radius:8px">
      <div><b style="color:var(--accent)">${r.count}건</b>이 나갑니다
        <span class="meta">· ${(r.bytes / 1024).toFixed(1)}KB · ${esc(r.filename)}</span></div>
      <div style="margin-top:6px;max-height:230px;overflow:auto">${rows}</div>
      ${r.count > r.items.length ? `<div class="meta" style="margin-top:5px">… 외 ${r.count - r.items.length}건</div>` : ""}
      <div class="note" style="margin-top:7px">저장 위치: ${esc(r.default_dir)}</div>
    </div>`;
  } catch (err) { expError(err.message); }
}

async function doExportSave() {
  expBusy("파일로 저장하는 중…");
  try {
    const r = await api("/api/export", { method: "POST", body: exportPayload() });
    $("#expOut").innerHTML = `<div style="margin-top:10px;padding:10px 12px;background:var(--panel-2);border-radius:8px">
      <div><b style="color:var(--accent-2)">메모 ${r.count}건을 내보냈습니다.</b></div>
      <div class="meta" style="margin-top:4px;word-break:break-all">${esc(r.path)} · ${(r.bytes / 1024).toFixed(1)}KB</div>
      <div class="note" style="margin-top:5px">이 파일을 그대로 전달하세요.
        받는 쪽은 <b>받은 메모 파일 넣기</b>에 경로를 넣고 가져오면 됩니다.</div>
      <div class="row" style="margin-top:8px"><span class="spacer"></span>
        <button class="btn" id="expCopyPath">경로 복사</button></div>
    </div>`;
    $("#expCopyPath").onclick = () => { navigator.clipboard.writeText(r.path); toast("경로를 복사했습니다"); };
    toast(`${r.count}건을 파일로 내보냈습니다`);
  } catch (err) { expError(err.message); }
}

async function doExportCopy() {
  expBusy("만드는 중…");
  try {
    const r = await api("/api/export/content", { method: "POST", body: exportPayload() });
    await navigator.clipboard.writeText(r.content);
    $("#expOut").innerHTML = `<div class="status" style="margin-top:9px">메모 ${r.count}건을 복사했습니다 —
      메신저에 붙여넣어 보내세요. 받는 쪽은 이 내용을 .json 파일로 저장하면 됩니다.</div>`;
    toast(`${r.count}건을 복사했습니다`);
  } catch (err) { expError(err.message); }
}

function redminePayload() {
  if (!$("#rmUrl")) return {};   // 가져오기 탭이 아닐 때
  return {
    url: $("#rmUrl").value.trim(),
    api_key: $("#rmKey").value.trim(),
    projects: $("#rmProjects").value.trim(),
    kinds: [...document.querySelectorAll("[data-kind]")].filter((c) => c.checked).map((c) => c.dataset.kind).join(","),
    limit: +$("#rmLimit").value || 300,
    since: $("#rmSince").value.trim(),
    include_notes: $("#rmNotes").checked,
  };
}

async function doImport(dry, source = "all") {
  const targets = source === "all"
    ? [...document.querySelectorAll("[id^='impOut-']")].map((d) => d.id.slice(8))
    : [source];
  const busy = `<div class="status" style="margin-top:8px">${dry ? "확인" : "가져오기"} 중…</div>`;
  targets.forEach((n) => { const el = $(`#impOut-${n}`); if (el) el.innerHTML = busy; });

  const body = {
    source, path: imp.path || null, shared_path: imp.sharedPath || null,
    min_chars: imp.minChars, update_existing: imp.update, tags: imp.tags,
    redmine: redminePayload(),
  };
  try {
    const r = await api(dry ? "/api/import/preview" : "/api/import/run", { method: "POST", body });
    targets.forEach((n) => { const el = $(`#impOut-${n}`); if (el) el.innerHTML = ""; });
    r.results.forEach((x) => {
      const res = { ...x, dry_run: r.dry_run };
      imp.results[x.source] = res;
      paintResult(x.source, res);
    });
    if (!dry) {
      const parts = [r.total ? `${r.total}건 가져옴` : "", r.total_updated ? `${r.total_updated}건 갱신` : ""].filter(Boolean);
      toast(parts.length ? `${parts.join(" · ")} — 정리는 백그라운드에서 진행됩니다` : "새로 가져오거나 바뀐 메모가 없습니다");
      loadSidebar();
      loadTags();   // 붙인 태그의 건수가 바로 반영돼야 한다
    }
  } catch (err) {
    targets.forEach((n) => {
      const el = $(`#impOut-${n}`);
      if (el) el.innerHTML = `<div class="status" style="color:var(--danger);margin-top:8px">${esc(err.message)}</div>`;
    });
  }
}

function paintResult(name, x) {
  const el = $(`#impOut-${name}`);
  if (!el) return;
  const head = x.dry_run ? "미리보기" : "가져오기 완료";

  if (!x.available || x.error) {
    el.innerHTML = `<div class="status" style="margin-top:8px;color:${x.error && x.available ? "var(--danger)" : "var(--dim)"}">
      ${esc(x.error || "사용할 수 없습니다")}</div>`;
    return;
  }
  const skips = [
    x.skipped_existing ? `이미있음 ${x.skipped_existing}` : "",
    x.skipped_duplicate ? `같은 내용 ${x.skipped_duplicate}` : "",
    x.unchanged ? `변경없음 ${x.unchanged}` : "",
    x.skipped_empty ? `본문없음 ${x.skipped_empty}` : "",
    x.skipped_short ? `너무짧음 ${x.skipped_short}` : "",
  ].filter(Boolean).join(" · ");
  const updated = x.updated ? ` · <b style="color:var(--warn)">${x.updated}건 갱신</b>` : "";

  el.innerHTML = `<div style="margin-top:9px;padding:9px 11px;background:var(--panel-2);border-radius:8px">
    <div><span class="meta">${head}</span> — 원본 ${x.found}건 →
      <b style="color:var(--accent)">${x.importable}건</b>${updated}
      ${x.dry_run ? '<span class="meta">(아직 저장 안 함)</span>' : '<span class="meta">저장됨</span>'}
      ${skips ? `<span class="meta">· ${skips}</span>` : ""}</div>
    ${x.median_chars ? `<div class="meta">본문 길이 중앙값 ${x.median_chars}자 · 최대 ${x.max_chars}자</div>` : ""}
    ${x.samples.length ? `<div class="meta" style="margin-top:5px">${x.samples.map((s) => `· ${esc(s)}`).join("<br/>")}</div>` : ""}
  </div>`;
}

// ---------------------------------------------------------------- 내 태그 관리
function tagMsg(text, bad = false) {
  const el = $("#tagMsg");
  if (el) el.innerHTML = `<span style="color:${bad ? "var(--danger)" : "var(--dim)"}">${esc(text)}</span>`;
}

async function refreshTags() {
  await Promise.all([render(), loadSidebar(), loadTags()]);
}

function paintTagList() {
  const box = $("#tagList");
  if (!box) return;
  if (!myTags.length) {
    box.innerHTML = `<div class="status">아직 정해 둔 태그가 없습니다. 아래에서 하나 만들어 보세요.</div>`;
    return;
  }
  box.innerHTML = myTags.map((t, i) => `
    <div class="row" style="gap:8px;padding:7px 0;border-bottom:1px solid var(--line)">
      <span class="tagchip t-${esc(t.color)} on" style="cursor:default">#${esc(t.name)}</span>
      <span class="meta">메모 ${t.count}건</span>
      <span class="spacer"></span>
      <button class="btn ghost" data-tup="${i}" ${i === 0 ? "disabled" : ""} title="위로">↑</button>
      <button class="btn ghost" data-tdown="${i}" ${i === myTags.length - 1 ? "disabled" : ""} title="아래로">↓</button>
      <select data-tcolor="${esc(t.name)}" title="색">
        ${TAG_COLORS.map((c) => `<option value="${c}"${c === t.color ? " selected" : ""}>${c}</option>`).join("")}
      </select>
      <button class="btn ghost" data-trename="${esc(t.name)}">이름 바꾸기</button>
      <button class="btn ghost" data-tdel="${esc(t.name)}" data-n="${t.count}" style="color:var(--danger)">삭제</button>
    </div>`).join("") + `<div id="tagAction"></div>`;

  box.querySelectorAll("[data-tup]").forEach((b) => { b.onclick = () => moveTag(+b.dataset.tup, -1); });
  box.querySelectorAll("[data-tdown]").forEach((b) => { b.onclick = () => moveTag(+b.dataset.tdown, 1); });
  box.querySelectorAll("[data-tcolor]").forEach((s) => {
    s.onchange = async () => {
      await api(`/api/tags/${encodeURIComponent(s.dataset.tcolor)}`,
                { method: "PUT", body: { color: s.value } });
      await refreshTags();
    };
  });
  box.querySelectorAll("[data-trename]").forEach((b) => { b.onclick = () => askRename(b.dataset.trename); });
  box.querySelectorAll("[data-tdel]").forEach((b) => { b.onclick = () => askDeleteTag(b.dataset.tdel, +b.dataset.n); });
}

async function moveTag(index, delta) {
  const order = myTags.map((t) => t.name);
  const to = index + delta;
  if (to < 0 || to >= order.length) return;
  [order[index], order[to]] = [order[to], order[index]];
  await api("/api/tags/order", { method: "POST", body: { order } });
  await refreshTags();
}

function askRename(name) {
  const box = $("#tagAction");
  // 이름을 바꾸면 메모 본문까지 바뀐다. 무슨 일이 벌어지는지 먼저 말해야 한다.
  box.innerHTML = `<div style="margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px">
      <div><b>#${esc(name)}</b> 의 이름을 바꿉니다.</div>
      <div class="note" style="margin-top:4px">이 태그가 달린 <b>메모 본문의 <code>#${esc(name)}</code> 도 함께 바뀝니다.</b>
        <code>#${esc(name)}팀</code> 처럼 이어 붙은 다른 태그는 건드리지 않습니다.</div>
      <div class="row" style="margin-top:9px;gap:8px">
        <input id="renameTo" value="${esc(name)}" style="flex:1" />
        <button class="btn" data-cancel>취소</button>
        <button class="btn primary" data-go>바꾸기</button>
      </div>
      <div class="note" id="renameMsg"></div>
    </div>`;
  box.querySelector("[data-cancel]").onclick = () => { box.innerHTML = ""; };
  box.querySelector("[data-go]").onclick = async () => {
    const to = $("#renameTo").value.trim();
    if (!to || to === name) { box.innerHTML = ""; return; }
    try {
      const r = await api(`/api/tags/${encodeURIComponent(name)}`, { method: "PUT", body: { name: to } });
      toast(`#${name} → #${r.name} · 메모 ${r.memos_changed || 0}건도 고쳤습니다`);
      await refreshTags();
    } catch (err) {
      $("#renameMsg").innerHTML = `<span style="color:var(--danger)">${esc(err.message)}</span>`;
    }
  };
  $("#renameTo").focus();
}

function askDeleteTag(name, count) {
  const box = $("#tagAction");
  box.innerHTML = `<div style="margin-top:10px;padding:10px 12px;border:1px solid var(--danger);border-radius:8px">
      <div><b style="color:var(--danger)">#${esc(name)}</b> 을 목록에서 뺍니다.</div>
      <div class="note" style="margin-top:4px">기본은 <b>목록에서만</b> 빠집니다 — 메모 ${count}건에 적힌
        <code>#${esc(name)}</code> 는 그대로 남고 조회도 됩니다.</div>
      <label style="display:block;margin-top:8px;color:var(--dim);font-size:13.5px;cursor:pointer">
        <input type="checkbox" id="purgeTag" style="margin-right:6px"/>메모 본문에서도 지우기
        <b style="color:var(--danger)">(메모 ${count}건이 수정됩니다 · 되돌릴 수 없음)</b></label>
      <div class="row" style="margin-top:9px">
        <span class="spacer"></span>
        <button class="btn" data-cancel>취소</button>
        <button class="btn primary" data-go style="background:var(--danger);border-color:var(--danger)">빼기</button>
      </div>
    </div>`;
  box.querySelector("[data-cancel]").onclick = () => { box.innerHTML = ""; };
  box.querySelector("[data-go]").onclick = async () => {
    const purge = $("#purgeTag").checked;
    const r = await api(`/api/tags/${encodeURIComponent(name)}?purge=${purge}`, { method: "DELETE" });
    toast(purge ? `#${name} 을 메모 ${r.memos_changed}건에서 지웠습니다` : `#${name} 을 목록에서 뺐습니다`);
    state.tags = state.tags.filter((t) => t !== name);
    await refreshTags();
  };
}

        <div>
          <div class="tagrow" id="suggestRow">${tg.suggested.map((t) =>
            `<button type="button" class="tagchip t-slate" data-adopt="${esc(t.value)}">#${esc(t.value)}<span class="n">${t.count}</span></button>`).join("")}</div>
          <div class="note">메모에는 쓰는데 목록엔 없는 태그입니다. 눌러서 데려오세요.</div>
        </div>
      </div>` : ""}
    </div>

    <div class="panel">
      <h3>LLM 연결 <span class="meta">${cfg.llm_ready ? `● ${esc(cfg.providers.find((x) => x.name === cfg.provider)?.label || "")} 사용 중` : "○ 미설정"}</span></h3>
      <div class="desc">
        설정이 없어도 앱은 전부 동작합니다 — 생성 기능이 결과물 대신 <b>완성된 프롬프트</b>를 돌려주니
        원하는 LLM 에 붙여 넣으면 됩니다. 키는 이 PC 의 <code>${esc(cfg.db_path)}</code> 에
        <b>평문으로</b> 저장되니 공용 PC 라면 환경변수 쪽을 쓰세요.
      </div>
      <div class="tabs" style="margin-bottom:14px">${tabs}</div>
      <div class="desc" style="margin-bottom:14px">${esc(p.note)}</div>

      ${p.needs_key ? `
      <div class="field">
        <label>API 키</label>
        <input type="password" id="setKey" placeholder="${s[K("api_key")]?.configured ? esc(s[K("api_key")].value) + " — 바꾸려면 새로 입력" : esc(p.key_hint || "키를 입력하세요")}" />
        <div class="note">${src(K("api_key"))} 비워 두고 저장하면 환경변수 값으로 되돌아갑니다.</div>
      </div>` : `
      <div class="field">
        <label>API 키</label>
        <div class="status">필요 없습니다 — 내 PC 에서 도는 모델입니다.</div>
      </div>`}

      <div class="field">
        <label>모델</label>
        <input id="setModel" list="modelList" value="${esc(s[K("model")].value)}" />
        <datalist id="modelList">${p.model_choices.map((m) => `<option value="${esc(m)}">`).join("")}</datalist>
        <div class="note" id="modelNote">${src(K("model"))} 목록에서 고르거나 직접 입력할 수 있습니다.
          <a href="#" id="loadModels" style="color:var(--accent)">서버에서 모델 목록 불러오기</a></div>
      </div>

      ${p.base_url_editable ? `
      <div class="field">
        <label>서버 주소</label>
        <input id="setBase" value="${esc(s[K("base_url")].value)}" placeholder="${esc(p.default_base_url)}" />
        <div class="note">${src(K("base_url"))} 기본값: <code>${esc(p.default_base_url)}</code></div>
      </div>` : ""}

      <div class="field">
        <label>추론 강도</label>
        <select id="setEffort">${cfg.effort_choices.map((e) =>
          `<option value="${e.value}"${e.value === s[K("effort")].value ? " selected" : ""}>${esc(e.label)}</option>`).join("")}</select>
        <div class="note">${src(K("effort"))} 높을수록 품질↑ 비용·시간↑.
          ${active === "ollama"
            ? "작은 로컬 모델은 <b>추론 끄기</b>가 아니면 추론만 하다 답을 못 내는 경우가 많습니다."
            : "긴 문서 작성은 '높음' 이상을 권합니다."}</div>
      </div>

      <div class="field">
        <label>최대 출력 토큰</label>
        <input type="number" id="setMax" value="${esc(s["llm.max_tokens"].value)}" min="500" step="500" />
      </div>
      <div class="row" style="margin-top:12px">
        <span class="spacer"></span>
        <button class="btn" id="testLlm">연결 테스트</button>
        <button class="btn primary" id="saveLlm">${active === cfg.provider ? "저장" : "저장하고 이 프로바이더 사용"}</button>
      </div>
      <div id="testOut" style="margin-top:10px"></div>
    </div>

    <div class="panel">
      <h3>생성 기본값</h3>
      <div class="desc">'생성' 탭에서 매번 바꾸지 않아도 되도록 기본값을 정해 둡니다.</div>
      <div class="field">
        <label>근거 토큰 예산</label>
        <input type="number" id="setBudget" value="${esc(s["gen.budget_tokens"].value)}" min="500" step="500" />
        <div class="note">근거로 넣을 메모 분량. 넘치면 조용히 자르지 않고 제외 목록으로 알려줍니다.</div>
      </div>
      <div class="field">
        <label>검색 질의 개수</label>
        <input type="number" id="setQ" value="${esc(s["gen.query_count"].value)}" min="1" max="6" />
        <div class="note">지시사항 하나에서 몇 가지 각도로 검색할지. 많을수록 폭넓지만 느려집니다.</div>
      </div>
      <div class="row" style="margin-top:12px">
        <span class="spacer"></span>
        <button class="btn primary" id="saveGen">저장</button>
      </div>
    </div>

    <div class="panel">
      <h3>임베딩 (의미 검색)</h3>
      <div class="desc" id="embedDesc">불러오는 중…</div>
      <div class="row" style="margin:0"><span class="spacer"></span>
        <button class="btn" id="reindexBtn">전체 재색인</button>
      </div>
    </div>`;

  const save = async (values, msg) => {
    await api("/api/settings", { method: "PUT", body: { values } });
    toast(msg);
    render(); loadSidebar();
  };

  paintTagList();
  $("#addTag").onclick = async () => {
    const name = $("#newTag").value.trim();
    if (!name) { tagMsg("태그 이름을 입력하세요.", true); return; }
    try {
      await api("/api/tags", { method: "POST", body: { name, color: $("#newTagColor").value } });
      $("#newTag").value = "";
      toast(`#${name} 을 만들었습니다`);
      await refreshTags();
    } catch (err) { tagMsg(err.message, true); }
  };
  $("#newTag").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#addTag").click(); });
  document.querySelectorAll("[data-adopt]").forEach((b) => {
    b.onclick = async () => {
      await api("/api/tags/adopt", { method: "POST", body: { names: [b.dataset.adopt] } });
      toast(`#${b.dataset.adopt} 을 목록에 넣었습니다`);
      await refreshTags();
    };
  });

  // 프로바이더 탭: 저장 전까지는 화면만 바꾼다 — 실수로 전환되지 않게.
  document.querySelectorAll("[data-prov]").forEach((b) => {
    b.onclick = () => { settingsProvider = b.dataset.prov; render(); };
  });

  // 하드코딩한 모델 후보는 금방 틀린다. 서버에 실제로 뭐가 있는지 물어본다.
  $("#loadModels").onclick = async (e) => {
    e.preventDefault();
    const note = $("#modelNote");
    note.innerHTML = `불러오는 중…`;
    const q = new URLSearchParams();
    if ($("#setBase") && $("#setBase").value.trim()) q.set("base_url", $("#setBase").value.trim());
    if ($("#setKey") && $("#setKey").value.trim()) q.set("api_key", $("#setKey").value.trim());
    try {
      const r = await api(`/api/providers/${active}/models?${q}`);
      $("#modelList").innerHTML = r.models.map((m) => `<option value="${esc(m)}">`).join("");
      note.innerHTML = r.live
        ? `서버에서 ${r.models.length}개 확인: ${r.models.map(esc).join(", ")}`
        : `서버에서 목록을 못 받아 기본 후보를 보여줍니다.`;
    } catch (err) {
      note.innerHTML = `<span style="color:var(--danger)">목록 조회 실패: ${esc(err.message)}</span>`;
    }
  };

  $("#saveLlm").onclick = () => {
    const values = {
      "llm.provider": active,
      [K("model")]: $("#setModel").value.trim(),
      "llm.max_tokens": $("#setMax").value,
    };
    if ($("#setBase")) values[K("base_url")] = $("#setBase").value.trim();
    if ($("#setEffort")) values[K("effort")] = $("#setEffort").value;
    const key = $("#setKey") ? $("#setKey").value.trim() : "";
    if (key) values[K("api_key")] = key;
    settingsProvider = null;
    save(values, `${p.label} 로 설정했습니다`);
  };
  $("#saveGen").onclick = () => save({
    "gen.budget_tokens": $("#setBudget").value,
    "gen.query_count": $("#setQ").value,
  }, "저장했습니다");
  $("#testLlm").onclick = async () => {
    $("#testOut").innerHTML = `<div class="status">테스트 중…</div>`;
    // 저장 전 입력값 그대로 테스트한다 — 잘못된 키를 저장하고 나서 알게 되면 늦다.
    const r = await api("/api/settings/test", { method: "POST", body: {
      provider: active,
      api_key: $("#setKey") ? $("#setKey").value.trim() : "",
      model: $("#setModel").value.trim(),
      base_url: $("#setBase") ? $("#setBase").value.trim() : "",
    } });
    $("#testOut").innerHTML = `<div class="status" style="color:${r.ok ? "var(--accent-2)" : "var(--danger)"}">${r.ok ? "✓" : "✗"} ${esc(r.message)}</div>`;
  };

  const st = await api("/api/stats");
  const e = st.embedder;
  const stored = (st.stored_embeddings || []).map((x) => `${esc(x.model)} (${x.chunks}청크)`).join(", ") || "없음";
  $("#embedDesc").innerHTML = `
    현재 임베더: <b>${esc(e.model)}</b> — ${esc({ ready: "준비됨", loading: "로딩 중", fallback: "폴백(모델 미로드)", failed: "로드 실패" }[e.state] || e.state)}<br/>
    DB 에 저장된 임베딩: ${stored}<br/>
    ${e.error ? `<span style="color:var(--danger)">${esc(e.error)}</span><br/>` : ""}
    모델을 바꾸려면 <code>MEMOINALL_EMBED_MODEL</code> 환경변수를 설정하고 재시작하세요 — 자동으로 재색인됩니다.`;
  $("#reindexBtn").onclick = async () => {
    const r = await api("/api/reindex", { method: "POST", body: { all: true } });
    toast(`${r.queued}건 재색인 대기열에 넣었습니다`);
  };
}

// ---------------------------------------------------------------- 상세
async function openMemo(id) {
  const m = await api(`/api/memos/${id}`);
  state.memo = m;
  $("#dTitle").textContent = m.title;
  $("#dMeta").textContent = fmt(m.created_at);
  $("#dBody").value = m.body;
  const f = m.facets || {};
  $("#dBadges").innerHTML = [
    ...(f.tag || []).map((t) => `<span class="badge tag">#${esc(t)}</span>`),
    ...(f.person || []).map((p) => `<span class="badge person">@${esc(p)}</span>`),
    ...(f.date || []).map((d) => `<span class="badge">${esc(d)}</span>`),
    ...(f.decision || []).map((d) => `<span class="badge">결정: ${esc(d.slice(0, 40))}</span>`),
  ].join("") || `<span class="status">추출된 항목 없음 (보강 대기 중일 수 있습니다)</span>`;
  $("#dSimilar").innerHTML = m.similar?.length
    ? `<div class="side-h">비슷한 메모</div><ul style="padding:0">${m.similar.map((s) => `<li data-memo="${s.id}" style="list-style:none;color:var(--dim);cursor:pointer;padding:2px 0">· ${esc(s.title)} <span class="meta">${fmt(s.created_at)}</span></li>`).join("")}</ul>`
    : "";
  $("#dSimilar").querySelectorAll("[data-memo]").forEach((li) => (li.onclick = () => openMemo(+li.dataset.memo)));
  $("#detail").showModal();
}

$("#dClose").onclick = () => $("#detail").close();
$("#dSave").onclick = async () => {
  await api(`/api/memos/${state.memo.id}`, { method: "PUT", body: { body: $("#dBody").value } });
  $("#detail").close();
  toast("수정했습니다");
  render(); loadSidebar();
};
$("#dDelete").onclick = async () => {
  if (!confirm("이 메모를 삭제할까요?")) return;
  await api(`/api/memos/${state.memo.id}`, { method: "DELETE" });
  $("#detail").close();
  toast("삭제했습니다");
  render(); loadSidebar();
};
$("#dPack").onclick = () => {
  gen.instruction = `"${state.memo.title}" 관련 내용을 정리해줘`;
  gen.plan = gen.output = null;
  $("#detail").close();
  goTab("generate");
};

document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement.tagName !== "TEXTAREA" && document.activeElement.tagName !== "INPUT") {
    e.preventDefault(); $("#q").focus();
  }
});

renderTabs();
loadSidebar();
loadTags();
render();
setInterval(loadSidebar, 6000);
$("#capture").focus();
</script>
</body>
</html>
